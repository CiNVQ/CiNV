<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Melody</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#000;--card:#1c1c1e;--line:rgba(255,255,255,.12);--txt:#fff;--mut:#8e8e93;--acc:#fff;--acc2:#fff;--on:#000}
:root[data-theme=light]{--bg:#f2f2f7;--card:#fff;--line:rgba(0,0,0,.1);--txt:#000;--acc:#000;--acc2:#000;--on:#fff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
.screen{position:absolute;inset:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 190px;overflow-y:auto}
.hide{display:none!important}
header{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.ava{width:42px;height:42px;border-radius:50%;background:var(--acc);color:var(--on);display:grid;place-items:center;font-weight:600;flex:none}
header small{color:var(--mut);display:block;font-size:13px}header b{font-size:17px;font-weight:600}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin-bottom:16px}
h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:28px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
h2 span{font-size:15px;color:var(--mut);font-weight:400}
.hero{border-radius:20px;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--card)}
.hero b{font-size:20px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
.pill{background:var(--acc);color:var(--on);padding:9px 20px;border-radius:999px;font-size:15px;font-weight:600;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:6px}.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 16px;border-radius:999px;background:var(--card);font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--acc);color:var(--on)}
.row{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.tile{flex:0 0 128px;text-align:left}
.cov{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:34px;font-weight:600;margin-bottom:8px;background-size:cover;color:rgba(255,255,255,.85)}
.tile b,.item b{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small,.item small{color:var(--mut);font-size:13px}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:.5px solid var(--line);cursor:pointer}
.item .cov{width:52px;flex:none;margin:0;font-size:20px;border-radius:8px}
.item .t{flex:1;min-width:0}.item.cur .cov{outline:2px solid var(--acc);outline-offset:2px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib:not(.on) svg{opacity:.35}
.rank{width:22px;text-align:center;font-weight:600;color:var(--mut)}
svg{width:22px;height:22px;fill:currentColor}
input[type=text]{width:100%;padding:12px 14px;border-radius:12px;background:var(--card);border:0;outline:0;margin-bottom:14px;font-size:16px}
.add{display:flex;gap:10px;margin-bottom:14px;align-items:flex-start}.add input{margin:0}
.empty{color:var(--mut);text-align:center;padding:34px 10px;font-size:15px}
.ah{display:flex;align-items:center;justify-content:space-between;margin:22px 0 6px;font-weight:700;font-size:18px}
.stat{display:flex;gap:12px;margin:16px 0}.stat div{flex:1;background:var(--card);border-radius:16px;padding:16px}
.stat b{font-size:28px;font-weight:700;display:block}.stat small{color:var(--mut)}
#mini{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 66px);display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border-radius:14px;background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);text-align:left;box-shadow:0 2px 20px rgba(0,0,0,.25)}
#mini .cov{width:42px;margin:0;font-size:16px;border-radius:8px;flex:none}
#mini .t{flex:1;min-width:0}#mini b{font-size:15px;font-weight:500;display:block}#mini small{font-size:12px;color:var(--mut)}
.play{width:36px;height:36px;display:grid;place-items:center;flex:none}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 4px);background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:.5px solid var(--line)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut);font-size:10px;font-weight:500}
nav button svg{width:24px;height:24px}nav button.on{color:var(--acc)}
#full{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 26px calc(env(safe-area-inset-bottom,0px) + 30px);background:var(--bg)}
#full .top{width:100%;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px}
#disc{width:min(82vw,340px);aspect-ratio:1;border-radius:18px;margin:32px 0 30px;display:grid;place-items:center;font-size:90px;font-weight:600;color:rgba(255,255,255,.85);box-shadow:0 20px 50px rgba(0,0,0,.35);background-size:cover;transition:transform .3s}
#disc:not(.go){transform:scale(.88)}
.meta{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px}
.meta b{font-size:22px;font-weight:700;display:block}.meta small{color:var(--mut);font-size:17px}
#seek{width:100%;margin:22px 0 6px;accent-color:var(--acc)}
.times{width:100%;display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.ctl{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:24px}
.ctl .big{width:72px;height:72px;border-radius:50%;background:var(--acc);color:var(--on);display:grid;place-items:center}
.big svg{width:30px;height:30px}.ctl svg{width:26px;height:26px}.on-t{color:var(--acc);opacity:1}#shuf:not(.on-t),#rep:not(.on-t){color:var(--mut)}
#sheet{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
#sheet>div{width:100%;max-height:70%;overflow:auto;background:var(--card);border-radius:14px 14px 0 0;padding:20px 20px 34px}

/* v3: свежий вид */
.screen{padding-bottom:210px}
.hi{color:var(--mut);font-size:15px;display:block}
.xl{font-size:40px;line-height:1.04;font-weight:800;letter-spacing:-.035em;margin:6px 0 20px}
.tabs{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;margin-bottom:18px}.tabs::-webkit-scrollbar{display:none}
.tabs button{font-size:20px;font-weight:700;color:var(--mut);padding-bottom:4px;white-space:nowrap;border-bottom:2px solid transparent;letter-spacing:-.01em}
.tabs button.on{color:var(--txt);border-color:var(--txt)}
.deck{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -20px;padding:0 20px 6px}.deck::-webkit-scrollbar{display:none}
.card{position:relative;flex:0 0 74%;aspect-ratio:4/5;border-radius:28px;scroll-snap-align:start;overflow:hidden;text-align:left;color:#fff;background-size:cover}
.card::before{content:'';position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.6))}
.big-l,.cap,.cp{position:absolute;z-index:1}
.big-l{top:-8px;right:14px;font-size:170px;font-weight:800;line-height:1;color:rgba(255,255,255,.12)}
.cap{left:18px;right:72px;bottom:18px}.cap b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}.cap small{opacity:.7;font-size:14px}
.cp{right:16px;bottom:16px;width:46px;height:46px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
.item{padding:14px 0}.item b{font-size:19px;font-weight:700;letter-spacing:-.01em}
.item.cur b::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--txt);margin-right:8px;vertical-align:middle}
.rank{width:32px;font-size:22px;font-weight:300;color:var(--mut)}
nav{left:50%;right:auto;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding:6px;gap:2px;border-radius:999px;border:.5px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.3)}
nav button{flex:none;width:58px;height:44px;border-radius:999px;justify-content:center}
nav button span{display:none}nav button.on{background:var(--txt);color:var(--bg)}
#mini{left:50%;right:auto;transform:translateX(-50%);width:calc(100% - 28px);max-width:420px;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);border-radius:999px;padding:6px 10px 6px 6px}
#mini .cov{width:40px;border-radius:50%}
#disc{border-radius:28px;width:min(86vw,360px)}
.meta b{font-size:30px;font-weight:800;letter-spacing:-.03em}

/* v4: компактнее + профиль */
h1{font-size:28px;margin-bottom:12px}
.screen{padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 150px}
.xl{font-size:28px;margin:4px 0 14px}.hi{font-size:13px}
h2{font-size:17px;margin:20px 0 10px}h2 span{font-size:13px}
.tabs{gap:18px;margin-bottom:14px}.tabs button{font-size:15px}
.deck{margin:0 -16px;padding:0 16px 4px;gap:10px}
.card{flex:0 0 56%;border-radius:20px}
.big-l{font-size:110px;top:-6px;right:10px}
.cap{left:12px;right:52px;bottom:12px}.cap b{font-size:17px}.cap small{font-size:12px}
.cp{width:34px;height:34px;right:10px;bottom:10px}.cp svg{width:16px;height:16px}
.item{padding:9px 0;gap:10px}.item b{font-size:16px}.item small{font-size:12px}
.ib{width:34px;height:34px}svg{width:20px;height:20px}
.rank{font-size:17px;width:26px}
.chip{padding:6px 13px;font-size:13px}.pill{padding:8px 16px;font-size:14px}
input[type=text]{padding:10px 12px;font-size:15px}
nav{padding:4px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
nav button{width:48px;height:36px}nav button svg{width:20px;height:20px}
#mini{bottom:calc(env(safe-area-inset-bottom,0px) + 58px);padding:5px 8px 5px 5px;width:calc(100% - 24px)}
#mini .cov{width:34px}#mini b{font-size:14px}#mini small{font-size:11px}.play{width:30px;height:30px}
#disc{width:min(68vw,270px);margin:20px 0 20px;font-size:70px;border-radius:22px}
.meta b{font-size:22px}.meta small{font-size:15px}
.ctl{margin-top:16px}.ctl .big{width:60px;height:60px}.big svg{width:26px;height:26px}.ctl svg{width:22px;height:22px}
.ava{width:38px;height:38px}
.pf{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.ava.big{width:64px;height:64px;font-size:26px}
.pn b{font-size:22px;font-weight:800;letter-spacing:-.02em;display:block}.pn small{color:var(--mut);font-size:13px}
.lvl{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.lt{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;font-weight:600}.lt span:last-child{color:var(--mut);font-weight:400}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--txt);border-radius:3px}
.stat3{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat3 div{background:var(--card);border-radius:14px;padding:10px 4px;text-align:center}
.stat3 b{font-size:20px;font-weight:800;display:block}.stat3 small{color:var(--mut);font-size:10px}
.br{display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:10px}
.br span{width:100px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.br small{color:var(--mut);width:24px;text-align:right}

/* v5: панель крупнее */
nav{padding:6px;gap:4px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
nav button{width:68px;height:52px}
nav button svg{width:26px;height:26px}
#mini{bottom:calc(env(safe-area-inset-bottom,0px) + 80px)}
.screen{padding-bottom:180px}

/* v6: анимации */
.cov,.card,#disc{background-position:center}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.enter>:nth-child(2){animation-delay:.05s}.enter>:nth-child(3){animation-delay:.1s}.enter>:nth-child(4){animation-delay:.15s}.enter>:nth-child(5){animation-delay:.2s}.enter>:nth-child(6){animation-delay:.25s}.enter>:nth-child(7){animation-delay:.3s}.enter>:nth-child(8){animation-delay:.35s}.enter>:nth-child(n+9){animation-delay:.4s}
.card,.item,.chip,.pill,.ib,nav button,.big,.tabs button{transition:transform .18s cubic-bezier(.2,.8,.2,1),background .25s,color .25s}
.card:active{transform:scale(.97)}.item:active{transform:scale(.985)}.chip:active,.pill:active,.ib:active,nav button:active,.tabs button:active{transform:scale(.92)}.big:active{transform:scale(.93)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
.ib.pop svg{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.item .eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-right:8px;vertical-align:middle}
.item .eq b{display:block;width:3px;height:3px;font-size:0;background:var(--txt);border-radius:2px;animation:eq .9s ease-in-out infinite}
.item .eq b:nth-child(2){animation-delay:.2s}.item .eq b:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.item b:has(.eq)::before{display:none}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}100%{box-shadow:0 0 0 14px rgba(255,255,255,0)}}
.card.playing .cp{animation:ring 1.6s ease-out infinite}
.card.sk{background:linear-gradient(100deg,var(--card) 30%,var(--line) 50%,var(--card) 70%);background-size:200% 100%;animation:sh 1.3s linear infinite}
.card.sk::before{display:none}@keyframes sh{to{background-position:-200% 0}}
#full{transform:translateY(100%);visibility:hidden;transition:transform .5s cubic-bezier(.2,.8,.2,1),visibility 0s .5s}
#full.open{transform:none;visibility:visible;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#full.open>:not(#disc){animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
#full.open>:nth-child(3){animation-delay:.08s}#full.open>:nth-child(4){animation-delay:.12s}#full.open>:nth-child(5){animation-delay:.16s}#full.open>:nth-child(6){animation-delay:.2s}
@keyframes up{from{transform:translateY(100%)}}@keyframes fade{from{opacity:0}}
#sheet:not(.hide){animation:fade .25s both}#sheet:not(.hide)>div{animation:up .4s cubic-bezier(.2,.8,.2,1) both}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%) translateY(-30px);opacity:0;background:var(--txt);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;z-index:20;transition:.35s cubic-bezier(.2,.8,.2,1);pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="screen" id="v"></main>

<div id="full">
  <div class="top"><button class="ib" onclick="openFull(false)" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="m15.4 5.4-6.6 6.6 6.6 6.6-1.4 1.4L6 12l8-8z"/></svg></button><span>Сейчас играет</span><button class="ib" onclick="sheet()" aria-label="В плейлист"><svg viewBox="0 0 24 24"><path d="M3 6h12v2H3zm0 4h12v2H3zm0 4h8v2H3zm14-4h2v4h4v2h-4v4h-2v-4h-4v-2h4z"/></svg></button></div>
  <div id="disc"></div>
  <div class="meta"><div><b id="fT"></b><small id="fA"></small></div><button class="ib" id="like" onclick="like(cur)" aria-label="Лайк"><svg viewBox="0 0 24 24"><path d="M12 21 10.6 19.7C5.4 15 2 12 2 8.5A5.5 5.5 0 0 1 7.5 3c1.7 0 3.4.8 4.5 2.1A6 6 0 0 1 16.5 3 5.5 5.5 0 0 1 22 8.5c0 3.5-3.4 6.5-8.6 11.2z"/></svg></button></div>
  <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
  <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <div class="ctl">
    <button id="shuf" aria-label="Перемешать"><svg viewBox="0 0 24 24"><path d="M17 3h4v4l-1.5-1.5-4 4-1.4-1.4 4-4zM3 6h4l9 12h3l-1.5-1.5 1.4-1.4L21 17.5V21h-4v-2h-1.5L6 8H3zm0 12h3l2-3 1.3 1.7L7.5 20H3z"/></svg></button>
    <button onclick="step(-1)" aria-label="Предыдущий"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zm3 7 10-7v14z"/></svg></button>
    <button class="big" id="pp" onclick="toggle()" aria-label="Играть/пауза"></button>
    <button onclick="step(1)" aria-label="Следующий"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5l10 7L5 19z"/></svg></button>
    <button id="rep" aria-label="Повтор"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
  </div>
</div>
<div id="sheet" class="hide" onclick="this.classList.add('hide')"><div onclick="event.stopPropagation()" id="sheetIn"></div></div>

<button id="mini" onclick="openFull(true)">
  <div class="cov" id="mC"></div>
  <div class="t"><b id="mT">Выберите трек</b><small id="mA">Melody</small></div>
  <span class="play" id="mP" onclick="event.stopPropagation();toggle()"></span>
</button>
<nav id="nav"></nav>

<script>
const tg=window.Telegram?.WebApp;
let tgName='Слушатель';
const light=tg?tg.colorScheme==='light':matchMedia('(prefers-color-scheme:light)').matches;
document.documentElement.dataset.theme=light?'light':'dark';
if(tg){tg.ready();tg.expand();const bg=light?'#f2f2f7':'#000000';tg.setHeaderColor?.(bg);tg.setBackgroundColor?.(bg);tgName=tg.initDataUnsafe?.user?.first_name||tgName;}

// ===== Каталог: Audius (легальная музыка независимых артистов) =====
const API='https://api.audius.co/v1';
const GN={'Electronic':'Электроника','Hip-Hop/Rap':'Хип-хоп','Pop':'Поп','Rock':'Рок','Ambient':'Эмбиент','Alternative':'Альтернатива','R&B/Soul':'R&B','Lo-Fi':'Lo-Fi','Jazz':'Джаз','Metal':'Метал'};
const mapT=x=>({id:'a'+x.id,t:x.title,a:x.user?.name||'Artist',cat:GN[x.genre]||x.genre||'Разное',img:x.artwork?.['480x480']||x.artwork?.['150x150']||'',src:`${API}/tracks/${x.id}/stream?app_name=Melody`});
// Тестовые треки на случай, если каталог не загрузился
const U='https://www.soundhelix.com/examples/mp3/SoundHelix-Song-';
const demo=[['Midnight Vibes','The Weekend','Новинки'],['Ocean Eyes','Soft Voice','Новинки'],['Circles Run','The Weekend','Вечеринка'],['Blinding Light','Soft Voice','Вечеринка'],['Rok Anthems','Rock Legends','Рок'],['Legends Forever','Rock Legends','Рок']]
 .map((d,i)=>({id:'d'+(i+1),t:d[0],a:d[1],cat:d[2],img:'',src:U+(i+1)+'.mp3'}));
let tracks=demo.slice(),extra=[],loading=true;
const reg={};demo.forEach(t=>reg[t.id]=t);
let cache={};try{cache=JSON.parse(localStorage.getItem('c')||'{}');Object.values(cache).forEach(t=>{if(t&&t.id&&t.src&&!reg[t.id])reg[t.id]=t})}catch(e){}
const touch=id=>{const t=reg[id];if(!t||id[0]=='d')return;cache[id]=t;try{localStorage.setItem('c',JSON.stringify(cache))}catch(e){}};
const ids=()=>[...new Set([...tracks,...extra].map(t=>t.id))];
const artists=()=>[...new Set(tracks.map(t=>t.a))];

// ===== Сохранение =====
let S={likes:[],plays:{},follows:[],pls:[],nick:''};
function save(){const j=JSON.stringify(S);try{if(j.length<3900)tg?.CloudStorage?.setItem('s',j)}catch(e){}try{localStorage.setItem('s',j)}catch(e){}}
function migrate(){const m=x=>typeof x==='number'?'d'+(x+1):x;S.likes=S.likes.map(m);const p={};Object.entries(S.plays).forEach(([k,v])=>p[m(isNaN(k)?k:+k)]=v);S.plays=p;S.pls.forEach(l=>l.ids=l.ids.map(m));}
function load(cb){let d=false;const fin=v=>{if(d)return;d=true;if(v){try{S={...S,...JSON.parse(v)}}catch(e){}}migrate();cb()};
 let ls=null;try{ls=localStorage.getItem('s')}catch(e){}
 if(tg?.CloudStorage){try{tg.CloudStorage.getItem('s',(e,v)=>fin(v||ls));setTimeout(()=>fin(ls),1500);return}catch(e){}}
 fin(ls)}

const $=id=>document.getElementById(id);
const I={play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',pause:'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',
 heart:'<svg viewBox="0 0 24 24"><path d="M12 21 10.6 19.7C5.4 15 2 12 2 8.5A5.5 5.5 0 0 1 7.5 3c1.7 0 3.4.8 4.5 2.1A6 6 0 0 1 16.5 3 5.5 5.5 0 0 1 22 8.5c0 3.5-3.4 6.5-8.6 11.2z"/></svg>',
 home:'<svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg>',
 search:'<svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 0 1 6.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1 1 10 2Zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/></svg>',
 lib:'<svg viewBox="0 0 24 24"><path d="M4 4h3v16H4zm5 0h3v16H9zm5.6.6 2.9-.8 4 15.5-2.9.8z"/></svg>',
 me:'<svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4 0-8 2-8 5v3h16v-3c0-3-4-5-8-5z"/></svg>'};
const grad=t=>{if(t.img)return `background-image:url('${t.img}')`;const g=22+(t.t.length*53)%28;return `background:linear-gradient(135deg,hsl(0,0%,${g+14}%),hsl(0,0%,${g-8}%))`;};
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const haptic=()=>tg?.HapticFeedback?.impactOccurred('light');
const toastEl=document.createElement('div');toastEl.id='toast';document.body.appendChild(toastEl);
let tT;function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>toastEl.classList.remove('show'),2800);}
let fxT;function fx(){const v=$('v');v.classList.remove('enter');void v.offsetWidth;v.classList.add('enter');clearTimeout(fxT);fxT=setTimeout(()=>v.classList.remove('enter'),1000);}

let tab='home',cat='Все',seg='likes',cur=null,pop=null,shuffle=false,repeat=false,curCats=[];
const au=new Audio();au.preload='metadata';

// ===== Плеер =====
function play(id){if(!reg[id])return;if(id!==cur){cur=id;au.src=reg[id].src;S.plays[id]=(S.plays[id]||0)+1;touch(id);save();}au.play().catch(()=>{});haptic();ui();}
function toggle(){if(!cur)return play(ids()[0]);au.paused?au.play().catch(()=>{}):au.pause();haptic();}
function step(d){if(!cur)return;const l=ids();const p=l.indexOf(cur);const n=shuffle?l[Math.floor(Math.random()*l.length)]:l[(p+d+l.length)%l.length];cur=null;play(n);}
function openFull(v){if(!cur&&v)return;$('full').classList.toggle('open',!!v);}
function like(id){if(!id)return;const k=S.likes.indexOf(id);if(k<0){S.likes.push(id);pop=id;touch(id);}else S.likes.splice(k,1);save();haptic();ui();setTimeout(()=>pop=null,600);}
function follow(n){const a=artists()[n];const k=S.follows.indexOf(a);k<0?S.follows.push(a):S.follows.splice(k,1);save();render();}
function ui(){
  const t=reg[cur];
  if(t){$('mT').textContent=$('fT').textContent=t.t;$('mA').textContent=$('fA').textContent=t.a;
    $('mC').style.cssText=grad(t);$('mC').textContent=t.img?'':t.t[0];$('disc').style.cssText=grad(t);$('disc').textContent=t.img?'':t.t[0];
    $('like').classList.toggle('on',S.likes.includes(cur));}
  const ic=au.paused?I.play:I.pause;$('mP').innerHTML=ic;$('pp').innerHTML=ic;$('disc').classList.toggle('go',!au.paused);
  if(tab==='search'&&$('q'))doSearch($('q').value,true);else render();
}
au.addEventListener('play',ui);au.addEventListener('pause',ui);
au.addEventListener('error',()=>{if(cur)toast('Не удалось загрузить трек');});
au.addEventListener('loadedmetadata',()=>$('dur').textContent=fmt(au.duration));
au.addEventListener('timeupdate',()=>{$('cur').textContent=fmt(au.currentTime);if(au.duration)$('seek').value=au.currentTime/au.duration*100;});
au.addEventListener('ended',()=>repeat?(au.currentTime=0,au.play().catch(()=>{})):step(1));
$('seek').addEventListener('input',e=>{if(au.duration)au.currentTime=e.target.value/100*au.duration;});
$('shuf').onclick=e=>{shuffle=!shuffle;e.currentTarget.classList.toggle('on-t',shuffle)};
$('rep').onclick=e=>{repeat=!repeat;e.currentTarget.classList.toggle('on-t',repeat)};

// ===== Шаблоны =====
function row(id,ex=''){const t=reg[id];if(!t)return'';const on=id===cur;const eq=on&&!au.paused?'<i class="eq"><b></b><b></b><b></b></i>':'';
 return `<div class="item ${on?'cur':''}" onclick="play('${id}')">${ex}<div class="t"><b>${eq}${esc(t.t)}</b><small>${esc(t.a)}</small></div><button class="ib ${S.likes.includes(id)?'on':''} ${id===pop?'pop':''}" onclick="event.stopPropagation();like('${id}')" aria-label="Лайк">${I.heart}</button></div>`;}
const rows=l=>l.map(id=>row(id)).join('')||'<div class="empty">Здесь пока пусто</div>';

// ===== Экраны =====
const V={
home(){curCats=['Все',...[...new Set(tracks.map(t=>t.cat))].slice(0,6)];
 const vis=tracks.filter(t=>cat=='Все'||t.cat==cat).map(t=>t.id);
 const fav=tracks.filter(t=>S.follows.includes(t.a)).map(t=>t.id);
 const card=id=>{const t=reg[id],pl=id===cur&&!au.paused;return `<button class="card ${pl?'playing':''}" style="${grad(t)}" onclick="play('${id}')"><span class="big-l">${t.img?'':esc(t.t[0])}</span><span class="cap"><b>${esc(t.t)}</b><small>${esc(t.a)}</small></span><span class="cp">${pl?I.pause:I.play}</span></button>`};
 return `<small class="hi">Привет, ${esc(S.nick||tgName)}</small><h1 class="xl">Что послушаем?</h1>
 <div class="tabs">${curCats.map((c,n)=>`<button class="${c==cat?'on':''}" onclick="setCat(${n})">${esc(c)}</button>`).join('')}</div>
 <div class="deck">${loading?'<div class="card sk"></div>'.repeat(3):vis.slice(0,12).map(card).join('')}</div>
 ${fav.length?`<h2>Ваши исполнители</h2>${rows(fav)}`:''}
 <h2>Все треки</h2>${loading?'<div class="empty">Загружаем музыку…</div>':rows(vis)}`},
search(){return `<h1>Поиск</h1><input type="text" id="q" placeholder="Трек или исполнитель" oninput="doSearch(this.value)" autocomplete="off"><div id="res">${rows(ids())}</div>`},
lib(){const seg3=[['likes','Лайки'],['pl','Плейлисты'],['art','Исполнители']];
 let body='';
 if(seg=='likes')body=rows(S.likes);
 if(seg=='art')body=artists().map((a,n)=>`<div class="ah"><span>${esc(a)}</span><button class="chip ${S.follows.includes(a)?'on':''}" onclick="follow(${n})">${S.follows.includes(a)?'Вы подписаны':'Подписаться'}</button></div>${rows(tracks.filter(t=>t.a==a).map(t=>t.id))}`).join('');
 if(seg=='pl')body=`<div class="add"><input type="text" id="np" placeholder="Название плейлиста"><button class="pill" onclick="newPl()">Создать</button></div>`+
  (S.pls.length?S.pls.map((p,k)=>`<div class="ah"><span>${esc(p.n)}</span><button class="chip" onclick="delPl(${k})">Удалить</button></div>${rows(p.ids)}`).join(''):'<div class="empty">Создайте первый плейлист, а добавлять треки можно кнопкой «+» в плеере</div>');
 return `<h1>Моя музыка</h1><div class="chips">${seg3.map(([k,n])=>`<button class="chip ${seg==k?'on':''}" onclick="setSeg('${k}')">${n}</button>`).join('')}</div>${body}`},
me(){
 const total=Object.values(S.plays).reduce((x,y)=>x+y,0);
 const u=tg?.initDataUnsafe?.user, handle=u?.username?'@'+u.username:'';
 const top=Object.entries(S.plays).sort((x,y)=>y[1]-x[1]).map(e=>e[0]).filter(id=>reg[id]).slice(0,10);
 const byA={},byC={};
 Object.entries(S.plays).forEach(([id,n])=>{const t=reg[id];if(t){byA[t.a]=(byA[t.a]||0)+n;byC[t.cat]=(byC[t.cat]||0)+n;}});
 const ta=Object.entries(byA).sort((x,y)=>y[1]-x[1]).slice(0,3);
 const gc=Object.entries(byC).sort((x,y)=>y[1]-x[1])[0];
 const L=[[0,'Новичок'],[10,'Меломан'],[50,'Эксперт'],[200,'Легенда']];
 let k=0;L.forEach((l,n)=>{if(total>=l[0])k=n});
 const nx=L[k+1],pct=nx?Math.min(100,(total-L[k][0])/(nx[0]-L[k][0])*100):100;
 const name=S.nick||tgName;
 return `<h1>Профиль</h1>
 <div class="pf"><div class="ava big">${esc(name[0].toUpperCase())}</div><div class="pn"><b>${esc(name)}</b><small>${esc([handle,L[k][1]].filter(Boolean).join(' · '))}</small></div></div>
 <div class="lvl"><div class="lt"><span>${L[k][1]}</span><span>${nx?total+' / '+nx[0]+' до «'+nx[1]+'»':'максимальный уровень'}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>
 <div class="stat3"><div><b>${total}</b><small>прослушиваний</small></div><div><b>${S.likes.length}</b><small>лайков</small></div><div><b>${S.pls.length}</b><small>плейлистов</small></div><div><b>${S.follows.length}</b><small>подписок</small></div></div>
 <h2>Никнейм</h2>
 <div class="add"><input type="text" id="nick" maxlength="20" placeholder="Придумайте никнейм" value="${esc(S.nick)}"><button class="pill" onclick="saveNick()">Сохранить</button></div>
 ${ta.length?`<h2>Любимые исполнители</h2>${ta.map(([n,c])=>`<div class="br"><span>${esc(n)}</span><div class="bar"><i style="width:${c/ta[0][1]*100}%"></i></div><small>${c}</small></div>`).join('')}`:''}
 ${gc?`<h2>Любимый жанр</h2><div class="chips"><span class="chip on">${esc(gc[0])}</span></div>`:''}
 <h2>Мой рейтинг прослушиваний</h2>${top.length?top.map((id,n)=>row(id,`<span class="rank">${n+1}</span>`)).join(''):'<div class="empty">Включите трек, и здесь появится рейтинг</div>'}
 ${total?`<div style="margin-top:18px"><button class="chip" onclick="resetStats()">Сбросить статистику</button></div>`:''}`}
};
function render(){
 const y=$('v').scrollTop;$('v').innerHTML=V[tab]();$('v').scrollTop=y;
 $('nav').innerHTML=[['home',I.home,'Главная'],['search',I.search,'Поиск'],['lib',I.lib,'Медиатека'],['me',I.me,'Профиль']].map(([k,s,n])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')">${s}<span>${n}</span></button>`).join('');
}
function go(k){tab=k;$('v').scrollTop=0;fx();render();}
function setCat(n){cat=curCats[n]||'Все';fx();render();}
function setSeg(k){seg=k;fx();render();}

// ===== Поиск (локально + в каталоге Audius) =====
const match=(id,k)=>(reg[id].t+' '+reg[id].a).toLowerCase().includes(k);
let st;
function doSearch(s,local){const k=s.trim().toLowerCase();$('res').innerHTML=rows(ids().filter(id=>match(id,k)));if(local||k.length<2)return;clearTimeout(st);st=setTimeout(()=>remote(k),450);}
async function remote(k){try{
 const r=await fetch(`${API}/tracks/search?query=${encodeURIComponent(k)}&limit=20&app_name=Melody`,{signal:AbortSignal.timeout?.(8000)});
 const list=((await r.json()).data||[]).filter(x=>x.is_streamable!==false).map(mapT);
 list.forEach(t=>{if(!reg[t.id]){reg[t.id]=t;extra.push(t)}});
 const q=$('q');if(tab==='search'&&q&&q.value.trim().toLowerCase()===k)$('res').innerHTML=rows([...new Set([...ids().filter(id=>match(id,k)),...list.map(t=>t.id)])]);
}catch(e){}}

// ===== Плейлисты, профиль =====
function newPl(){const n=$('np').value.trim();if(!n)return;S.pls.push({n:n.slice(0,30),ids:[]});save();render();}
function delPl(k){S.pls.splice(k,1);save();render();}
function saveNick(){S.nick=$('nick').value.trim().replace(/[<>]/g,'');save();haptic();render();}
function resetStats(){if(confirm("Сбросить статистику прослушиваний?")){S.plays={};save();render();}}
function sheet(){if(!cur)return;
 $('sheetIn').innerHTML=`<h2 style="margin-top:0">Добавить в плейлист</h2>`+(S.pls.length?S.pls.map((p,k)=>`<div class="item" onclick="addTo(${k})"><div class="t"><b>${esc(p.n)}</b><small>${p.ids.length} треков</small></div></div>`).join(''):'<div class="empty">Сначала создайте плейлист: Моя музыка → Плейлисты</div>');
 $('sheet').classList.remove('hide');}
function addTo(k){const p=S.pls[k];if(!p.ids.includes(cur)){p.ids.push(cur);touch(cur);}save();$('sheet').classList.add('hide');haptic();toast('Добавлено в «'+p.n+'»');render();}

async function loadNet(){
 try{const r=await fetch(`${API}/tracks/trending?limit=30&app_name=Melody`,{signal:AbortSignal.timeout?.(8000)});
  const list=((await r.json()).data||[]).filter(x=>x.is_streamable!==false).map(mapT);
  if(list.length){list.forEach(t=>reg[t.id]=t);tracks=list;cat='Все';}else toast('Каталог пуст, показаны тестовые треки');
 }catch(e){toast('Нет связи с каталогом, показаны тестовые треки');}
 loading=false;fx();render();
}

$('mP').innerHTML=I.play;$('pp').innerHTML=I.play;
render();fx();load(()=>{render();ui();});loadNet();
</script>
</body>
</html>
