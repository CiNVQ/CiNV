<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>CiNV</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#000000;
  --card:rgba(18,18,24,.82);
  --line:rgba(255,255,255,.12);
  --txt:#ffffff;
  --mut:#b0b0be;
  --acc:#6ee7ff;
  --acc2:#b794ff;
  --on:#000000;
  --glow:rgba(110,231,255,.45);
  --glow2:rgba(183,148,255,.35);
  --glass:rgba(255,255,255,.1);
  --glass2:rgba(255,255,255,.06);
  --radius:18px;
}
:root[data-theme=light]{
  --bg:#eef0f5;
  --card:rgba(255,255,255,.9);
  --line:rgba(0,0,0,.08);
  --txt:#0c0c12;
  --mut:#6b6b78;
  --acc:#0090a8;
  --acc2:#7c3aed;
  --on:#fff;
  --glow:rgba(0,144,168,.25);
  --glow2:rgba(124,58,237,.2);
  --glass:rgba(0,0,0,.03);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;background:#000;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;touch-action:manipulation;-ms-touch-action:manipulation;overscroll-behavior:none}
body{background-color:#000;background-image:
  radial-gradient(ellipse 90% 50% at 50% -15%,rgba(124,245,255,.09),transparent 55%),
  radial-gradient(ellipse 70% 40% at 100% 60%,rgba(192,132,255,.06),transparent 50%),
  radial-gradient(ellipse 50% 30% at 0% 90%,rgba(124,245,255,.05),transparent 45%);}
button,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
.screen{position:absolute;inset:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 180px;overflow-y:auto;z-index:1}
.hide{display:none!important}
.ava{width:42px;height:42px;border-radius:50%;background:var(--acc);color:var(--on);display:grid;place-items:center;font-weight:600;flex:none;background-size:cover;background-position:center;overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-bottom:12px}
h2{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:20px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 span{font-size:13px;color:var(--mut);font-weight:400}
.pill{background:var(--acc);color:var(--on);padding:8px 16px;border-radius:999px;font-size:14px;font-weight:600;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:6px}.chips::-webkit-scrollbar{display:none}
.chip{padding:6px 13px;border-radius:999px;background:var(--card);font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--acc);color:var(--on)}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:.5px solid var(--line);cursor:pointer}
.item .cov{width:48px;height:48px;flex:none;margin:0;font-size:18px;border-radius:10px;display:grid;place-items:center;background-size:cover;background-position:center;color:rgba(255,255,255,.85)}
.item .t{flex:1;min-width:0}.item.cur .cov{outline:2px solid var(--acc);outline-offset:2px}
.item b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{color:var(--mut);font-size:12px}
.ib{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib:not(.on) svg{opacity:.35}
.rank{width:26px;text-align:center;font-size:17px;font-weight:300;color:var(--mut)}
svg{width:20px;height:20px;fill:currentColor}
input[type=text]{width:100%;padding:10px 12px;border-radius:12px;background:var(--card);border:0;outline:0;margin-bottom:14px;font-size:15px}
.add{display:flex;gap:10px;margin-bottom:14px;align-items:flex-start}.add input{margin:0}
.empty{color:var(--mut);text-align:center;padding:34px 10px;font-size:15px}
.ah{display:flex;align-items:center;justify-content:space-between;margin:22px 0 6px;font-weight:700;font-size:18px}
#mini{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:420px;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);display:flex;align-items:center;gap:10px;padding:5px 8px 5px 5px;border-radius:999px;background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);text-align:left;box-shadow:0 2px 20px rgba(0,0,0,.25);z-index:18;pointer-events:auto}
#mini .cov{width:34px;height:34px;margin:0;font-size:14px;border-radius:50%;flex:none;display:grid;place-items:center;background-size:cover}
#mini .t{flex:1;min-width:0}#mini b{font-size:14px;font-weight:500;display:block}#mini small{font-size:11px;color:var(--mut)}
.play{width:30px;height:30px;display:grid;place-items:center;flex:none}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;padding:6px;gap:4px;border-radius:999px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:.5px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:20;pointer-events:auto;transition:opacity .25s,transform .3s cubic-bezier(.2,.8,.2,1)}
nav button{flex:none;width:68px;height:52px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--mut);pointer-events:auto}
nav button svg{width:26px;height:26px}nav button.on{background:var(--txt);color:var(--bg)}
body.player-open nav,body.player-open #mini{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(24px)}
#full{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 26px calc(env(safe-area-inset-bottom,0px) + 30px);background:var(--bg);transform:translateY(100%);visibility:hidden;pointer-events:none;transition:transform .42s cubic-bezier(.2,.8,.2,1),visibility 0s .42s}
#full.open{transform:none;visibility:visible;pointer-events:auto;transition:transform .42s cubic-bezier(.2,.8,.2,1)}
#full .top{width:100%;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px}
#disc{width:min(68vw,270px);aspect-ratio:1;border-radius:22px;margin:20px 0;display:grid;place-items:center;font-size:70px;font-weight:600;color:rgba(255,255,255,.85);box-shadow:0 20px 50px rgba(0,0,0,.35);background-size:cover;background-position:center;transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .35s,box-shadow .5s ease;position:relative}
#disc::after{content:'';position:absolute;inset:-12px;border-radius:28px;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.12),transparent 65%);opacity:0;transition:opacity .5s;pointer-events:none;z-index:-1}
#disc.go::after{opacity:1}
#disc:not(.go){transform:scale(.9)}
#disc.swap{opacity:0;transform:scale(.85) translateY(10px)}
.meta{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px}
.meta b{font-size:22px;font-weight:800;letter-spacing:-.03em;display:block}.meta small{color:var(--mut);font-size:15px}
#seek{width:100%;margin:22px 0 6px;accent-color:var(--acc)}
.times{width:100%;display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.ctl{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:16px}
.ctl .big{width:60px;height:60px;border-radius:50%;background:var(--acc);color:var(--on);display:grid;place-items:center}
.big svg{width:26px;height:26px}.ctl svg{width:22px;height:22px}.on-t{color:var(--acc);opacity:1}#shuf:not(.on-t),#rep:not(.on-t){color:var(--mut)}
#sheet{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
#sheet>div{width:100%;max-height:70%;overflow:auto;background:var(--card);border-radius:14px 14px 0 0;padding:20px 20px 34px}
.hi{color:var(--mut);font-size:13px;display:block}
.xl{font-size:28px;line-height:1.04;font-weight:800;letter-spacing:-.035em;margin:4px 0 14px}
.tabs{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}.tabs::-webkit-scrollbar{display:none}
.tabs button{font-size:15px;font-weight:700;color:var(--mut);padding-bottom:4px;white-space:nowrap;border-bottom:2px solid transparent;letter-spacing:-.01em}
.tabs button.on{color:var(--txt);border-color:var(--txt)}
.deck{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}.deck::-webkit-scrollbar{display:none}
.card{position:relative;flex:0 0 56%;aspect-ratio:4/5;border-radius:20px;scroll-snap-align:start;overflow:hidden;text-align:left;color:#fff;background-size:cover;background-position:center}
.card::before{content:'';position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.65))}
.big-l,.cap,.cp{position:absolute;z-index:1}
.big-l{top:-6px;right:10px;font-size:110px;font-weight:800;line-height:1;color:rgba(255,255,255,.12)}
.cap{left:12px;right:52px;bottom:12px}.cap b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.1}.cap small{opacity:.7;font-size:12px}
.cp{right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
.pf{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.ava.big{width:72px;height:72px;font-size:28px}
.pn b{font-size:22px;font-weight:800;letter-spacing:-.02em;display:block}.pn small{color:var(--mut);font-size:13px}
.lvl{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.lt{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;font-weight:600}.lt span:last-child{color:var(--mut);font-weight:400}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--txt);border-radius:3px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.stat3{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat3 div{background:var(--card);border-radius:14px;padding:10px 4px;text-align:center}
.stat3 b{font-size:20px;font-weight:800;display:block}.stat3 small{color:var(--mut);font-size:10px}
.br{display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:10px}
.br span{width:100px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.br small{color:var(--mut);width:24px;text-align:right}

/* Mood cards */
.moods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.mood{border-radius:18px;padding:16px 14px;min-height:78px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;text-align:left;color:#fff;font-weight:700;font-size:16px;letter-spacing:-.02em}
.mood small{font-size:12px;font-weight:500;opacity:.75;margin-top:2px}
.mood::after{content:'';position:absolute;inset:0;background:linear-gradient(160deg,transparent 30%,rgba(0,0,0,.35))}

/* Wave / flow card */
.wave{border-radius:22px;padding:20px;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 40%,#0f3460 100%);color:#fff;margin-bottom:6px;position:relative;overflow:hidden}
.wave b{font-size:20px;font-weight:800;display:block;letter-spacing:-.02em}
.wave small{opacity:.7;font-size:13px}
.wave .pill{position:absolute;right:16px;top:50%;transform:translateY(-50%);background:#fff;color:#000}

/* Welcome */
#welcome{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .7s cubic-bezier(.2,.8,.2,1),visibility .7s;overflow:hidden}
#welcome::before{content:'';position:absolute;inset:-20%;background:radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.06),transparent 60%);pointer-events:none}
#welcome.hide{opacity:0;visibility:hidden;pointer-events:none}
#welcome .logo{font-size:44px;font-weight:900;letter-spacing:-.04em;opacity:0;transform:translateY(16px);animation:welIn .75s .15s cubic-bezier(.2,.9,.2,1) forwards;position:relative;z-index:1}
#welcome .sub{font-size:17px;color:var(--mut);opacity:0;transform:translateY(16px);animation:welIn .75s .55s cubic-bezier(.2,.9,.2,1) forwards;position:relative;z-index:1}
#welcome .name{font-size:22px;font-weight:700;opacity:0;transform:translateY(12px);animation:welIn .7s .75s cubic-bezier(.2,.9,.2,1) forwards;position:relative;z-index:1;color:var(--txt)}
@keyframes welIn{to{opacity:1;transform:none}}
@keyframes welcomeGlow{0%{transform:scale(1) rotate(0deg);opacity:.7}100%{transform:scale(1.15) rotate(8deg);opacity:1}}
@keyframes shimmerText{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

/* Ambient background mesh */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(ellipse 80% 50% at 20% -10%,rgba(120,90,255,.09),transparent),
  radial-gradient(ellipse 60% 40% at 90% 10%,rgba(0,160,255,.07),transparent),
  radial-gradient(ellipse 50% 30% at 50% 100%,rgba(255,80,120,.05),transparent);
opacity:0;animation:ambientIn 1.4s .3s ease forwards}
body.player-open::before{opacity:.35;transition:opacity .6s}
@keyframes ambientIn{to{opacity:1}}

/* Animations — premium */
.cov,.card,#disc{background-position:center}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes riseSoft{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:none}}
@keyframes scaleIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes softPulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
@keyframes discSpin{to{transform:rotate(360deg)}}
@keyframes glowPulse{0%,100%{box-shadow:0 20px 50px rgba(0,0,0,.35),0 0 0 0 rgba(255,255,255,.08)}50%{box-shadow:0 28px 70px rgba(0,0,0,.45),0 0 40px 4px rgba(255,255,255,.12)}}
@keyframes shineSweep{0%{transform:translateX(-120%) skewX(-18deg)}100%{transform:translateX(220%) skewX(-18deg)}}
@keyframes barDance{0%,100%{height:4px}50%{height:100%}}
@keyframes navBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.enter>*{animation:rise .52s cubic-bezier(.2,.85,.2,1) both}
.enter>:nth-child(2){animation-delay:.05s}.enter>:nth-child(3){animation-delay:.09s}.enter>:nth-child(4){animation-delay:.13s}.enter>:nth-child(5){animation-delay:.17s}.enter>:nth-child(6){animation-delay:.21s}.enter>:nth-child(7){animation-delay:.25s}.enter>:nth-child(8){animation-delay:.29s}.enter>:nth-child(n+9){animation-delay:.33s}
.item{animation:riseSoft .42s cubic-bezier(.2,.85,.2,1) both}
.item:nth-child(1){animation-delay:.02s}.item:nth-child(2){animation-delay:.05s}.item:nth-child(3){animation-delay:.08s}.item:nth-child(4){animation-delay:.11s}.item:nth-child(5){animation-delay:.14s}.item:nth-child(6){animation-delay:.17s}.item:nth-child(7){animation-delay:.2s}.item:nth-child(8){animation-delay:.23s}.item:nth-child(n+9){animation-delay:.26s}
.card,.item,.chip,.pill,.ib,nav button,.big,.tabs button,.mood,.wave{transition:transform .22s cubic-bezier(.2,.85,.2,1),background .25s,color .25s,box-shadow .3s,opacity .25s,filter .25s}
.card:active,.mood:active,.wave:active{transform:scale(.96)}.item:active{transform:scale(.985)}.chip:active,.pill:active,.ib:active,nav button:active,.tabs button:active{transform:scale(.9)}.big:active{transform:scale(.92)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.5)}100%{transform:scale(1)}}
.ib.pop svg{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.item .eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-right:8px;vertical-align:middle}
.item .eq b{display:block;width:3px;height:3px;font-size:0;background:var(--txt);border-radius:2px;animation:eq .8s ease-in-out infinite}
.item .eq b:nth-child(2){animation-delay:.12s}.item .eq b:nth-child(3){animation-delay:.24s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.item b:has(.eq)::before{display:none}
.item.cur .cov{outline:2px solid var(--acc);outline-offset:2px;box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent);transition:box-shadow .3s,outline .2s}
.item .cov{transition:transform .25s cubic-bezier(.2,.85,.2,1),box-shadow .3s}
.item:active .cov{transform:scale(.94)}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}100%{box-shadow:0 0 0 18px rgba(255,255,255,0)}}
.card.playing .cp{animation:ring 1.6s ease-out infinite}
.card.sk{background:linear-gradient(100deg,var(--card) 30%,var(--line) 50%,var(--card) 70%);background-size:200% 100%;animation:sh 1.15s linear infinite}
.card.sk::before{display:none}@keyframes sh{to{background-position:-200% 0}}
#full.open>:not(#disc){animation:rise .58s cubic-bezier(.2,.85,.2,1) both}
#full.open>:nth-child(3){animation-delay:.06s}#full.open>:nth-child(4){animation-delay:.11s}#full.open>:nth-child(5){animation-delay:.16s}#full.open>:nth-child(6){animation-delay:.21s}

/* Disc — spin + glow */
#disc{transition:transform .38s cubic-bezier(.2,.85,.2,1),opacity .3s,box-shadow .4s;position:relative;overflow:hidden;will-change:transform}
#disc::before{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(125deg,transparent 35%,rgba(255,255,255,.18) 50%,transparent 65%);opacity:0;transform:translateX(-120%) skewX(-16deg);pointer-events:none;z-index:2}
#disc.go::before{animation:shineSweep 2.8s 0.4s ease-in-out infinite}
#disc.swap{opacity:0;transform:scale(.8) translateY(10px)}
#disc.go{box-shadow:0 24px 60px rgba(0,0,0,.45),0 0 50px rgba(255,255,255,.08);animation:glowPulse 3.2s ease-in-out infinite}
#disc.go .disc-inner{animation:discSpin 18s linear infinite}
#disc .disc-inner{width:100%;height:100%;border-radius:inherit;display:grid;place-items:center;background-size:cover;background-position:center;font-size:inherit;font-weight:inherit;color:inherit}
#disc:not(.go){transform:scale(.94)}
#disc.go:not(.swap){transform:scale(1)}

/* Mini player */
#mini{transition:transform .32s cubic-bezier(.2,.85,.2,1),opacity .25s,box-shadow .3s}
#mini.pulse{animation:miniPulse .55s cubic-bezier(.2,.85,.2,1)}
#mini.playing{box-shadow:0 4px 28px rgba(0,0,0,.35),0 0 0 1px color-mix(in srgb,var(--acc) 12%,transparent)}
#mini .cov{transition:transform .3s cubic-bezier(.2,.85,.2,1);position:relative}
#mini.playing .cov{animation:softPulse 2.4s ease-in-out infinite}
#mini .mini-bars{display:none;gap:2px;align-items:flex-end;height:14px;margin-right:4px}
#mini.playing .mini-bars{display:inline-flex}
#mini .mini-bars i{display:block;width:2.5px;background:var(--txt);border-radius:2px;animation:barDance .7s ease-in-out infinite}
#mini .mini-bars i:nth-child(1){height:40%;animation-delay:0s}
#mini .mini-bars i:nth-child(2){height:70%;animation-delay:.15s}
#mini .mini-bars i:nth-child(3){height:50%;animation-delay:.3s}
#mini .mini-bars i:nth-child(4){height:90%;animation-delay:.08s}
@keyframes miniPulse{0%{transform:translateX(-50%) scale(1)}40%{transform:translateX(-50%) scale(1.035)}100%{transform:translateX(-50%) scale(1)}}

/* Mood cards */
.mood{position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.mood::before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);transform:translateX(-130%) skewX(-18deg);pointer-events:none;z-index:1}
.mood:active::before{animation:shineSweep .55s ease-out}
.mood small,.mood span{position:relative;z-index:1}

/* Wave */
.wave{box-shadow:0 12px 32px rgba(0,0,0,.3);overflow:hidden}
.wave::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.12) 55%,transparent 70%);transform:translateX(-100%);animation:shineSweep 4.5s 1s ease-in-out infinite;pointer-events:none}
.wave:active{transform:scale(.97)}

/* Cards */
.card{box-shadow:0 10px 28px rgba(0,0,0,.28);transition:transform .25s cubic-bezier(.2,.85,.2,1),box-shadow .3s}
.card:active{box-shadow:0 4px 16px rgba(0,0,0,.2)}
.card.playing{box-shadow:0 14px 36px rgba(0,0,0,.4),0 0 0 2px color-mix(in srgb,var(--acc) 40%,transparent)}
.card .cp{transition:transform .2s,background .2s}
.card.playing .cp{background:var(--txt);color:var(--bg)}

#seek{accent-color:var(--acc);height:4px;border-radius:4px;cursor:pointer;transition:filter .2s}
#seek:active{filter:brightness(1.15)}
.times{letter-spacing:.02em}
.ctl .big{box-shadow:0 8px 28px rgba(0,0,0,.35);transition:transform .2s,box-shadow .3s}

<script>
const tg=window.Telegram?.WebApp;
let tgName='Слушатель', tgPhoto='';
// Always dark — futuristic glass UI
const light=false;
document.documentElement.dataset.theme='dark';
if(tg){
  tg.ready();tg.expand();
  try{tg.setHeaderColor?.('#05050a');tg.setBackgroundColor?.('#05050a');}catch(e){}

}

// ===== Каталог: Audius (легальная музыка независимых артистов) =====
const API='https://api.audius.co/v1';
const GN={'Electronic':'Электроника','Hip-Hop/Rap':'Хип-хоп','Pop':'Поп','Rock':'Рок','Ambient':'Эмбиент','Alternative':'Альтернатива','R&B/Soul':'R&B','Lo-Fi':'Lo-Fi','Jazz':'Джаз','Metal':'Метал','Techno':'Техно','House':'Хаус','Indie':'Инди','Folk':'Фолк','Classical':'Классика'};
const mapT=x=>{
  const t={id:'a'+x.id,t:x.title,a:x.user?.name||'Artist',cat:GN[x.genre]||x.genre||'Разное',img:x.artwork?.['480x480']||x.artwork?.['150x150']||'',src:`${API}/tracks/${x.id}/stream?app_name=CiNV`,mood:guessMood(x.genre,x.mood||'')};
  // catRu/moodRu set later via enrich when helpers exist; safe defaults
  t.catRu=t.cat;t.moodRu=t.mood;t._ru=/[а-яёА-ЯЁ]/.test(t.t+' '+t.a)?1:0;
  return t;
};
function guessMood(genre,mood){
  const g=(genre||'').toLowerCase(),m=(mood||'').toLowerCase();
  if(m.includes('chill')||m.includes('relax')||g.includes('ambient')||g.includes('lo-fi')||g.includes('lofi'))return 'Спокойствие';
  if(m.includes('energetic')||m.includes('upbeat')||g.includes('techno')||g.includes('house')||g.includes('electronic'))return 'Энергия';
  if(g.includes('hip-hop')||g.includes('rap')||g.includes('trap'))return 'Улица';
  if(g.includes('jazz')||g.includes('soul')||g.includes('r&b'))return 'Вайб';
  if(g.includes('rock')||g.includes('metal')||g.includes('punk'))return 'Драйв';
  if(g.includes('classical')||g.includes('piano')||g.includes('folk'))return 'Фокус';
  return 'Разное';
}
const U='https://www.soundhelix.com/examples/mp3/SoundHelix-Song-';
const demo=[
  ['Midnight Vibes','The Weekend','Новинки','Энергия'],
  ['Ocean Eyes','Soft Voice','Новинки','Спокойствие'],
  ['Circles Run','The Weekend','Вечеринка','Энергия'],
  ['Blinding Light','Soft Voice','Вечеринка','Энергия'],
  ['Rok Anthems','Rock Legends','Рок','Драйв'],
  ['Legends Forever','Rock Legends','Рок','Драйв'],
  ['Quiet Hours','Night Piano','Фокус','Фокус'],
  ['City Rain','Lo-Fi Collective','Lo-Fi','Спокойствие'],
  ['Neon Drift','Synthwave Lab','Электроника','Энергия'],
  ['Soft Focus','Ambient Garden','Эмбиент','Спокойствие']
].map((d,i)=>({id:'d'+(i+1),t:d[0],a:d[1],cat:d[2],mood:d[3],img:'',src:U+(i%6+1)+'.mp3'}));
let tracks=demo.slice(),extra=[],loading=true;
const reg={};demo.forEach(t=>reg[t.id]=t);
let cache={};try{cache=JSON.parse(localStorage.getItem('c')||'{}');Object.values(cache).forEach(t=>{if(t&&t.id&&t.src&&!reg[t.id])reg[t.id]=t})}catch(e){}
const touch=id=>{const t=reg[id];if(!t||id[0]=='d')return;cache[id]=t;try{localStorage.setItem('c',JSON.stringify(cache))}catch(e){}};
const ids=()=>[...new Set([...tracks,...extra].map(t=>t.id))];
const artists=()=>[...new Set(tracks.map(t=>t.a))];

// ===== Сохранение =====
let S={likes:[],plays:{},follows:[],pls:[],nick:'',last:null};
function save(){const j=JSON.stringify(S);try{if(j.length<3900)tg?.CloudStorage?.setItem('s',j)}catch(e){}try{localStorage.setItem('s',j)}catch(e){}}
function migrate(){const m=x=>typeof x==='number'?'d'+(x+1):x;S.likes=S.likes.map(m);const p={};Object.entries(S.plays).forEach(([k,v])=>p[m(isNaN(k)?k:+k)]=v);S.plays=p;S.pls.forEach(l=>l.ids=l.ids.map(m));if(S.last&&S.last.id)S.last.id=m(S.last.id);}
function saveLast(){
  if(!cur||!reg[cur])return;
  S.last={id:cur,time:Math.floor(au.currentTime||0),ctx:playContext||'',at:Date.now()};
  save();
}
function restoreLast(){
  const L=S.last;
  if(!L||!L.id||!reg[L.id])return false;
  cur=L.id;
  playContext=L.ctx||'';

        try{au.currentTime=seekTo;}catch(e){}
      }
      ui();
      updateMediaSession();
    };
    if(au.readyState>=1) applyTime();
    else{
      const once=()=>{au.removeEventListener('loadedmetadata',once);applyTime();};
      au.addEventListener('loadedmetadata',once);
      setTimeout(applyTime,1200);

}
// Убрать иностранные треки из статистики профиля
function cleanForeignFromProfile(){
  let changed=false;
  const keepId=id=>{
    const t=reg[id];
    if(!t)return false; // неизвестный/старый иностранный — выкидываем
    return isRussianTrack(t);
  };
  // plays
  const np={};
  Object.entries(S.plays||{}).forEach(([id,n])=>{
    if(keepId(id)) np[id]=n; else changed=true;
  });
  S.plays=np;
  // likes
  const nl=(S.likes||[]).filter(id=>{
    if(keepId(id))return true;
    changed=true;return false;
  });
  S.likes=nl;
  // playlists
  (S.pls||[]).forEach(p=>{
    const before=p.ids.length;
    p.ids=p.ids.filter(keepId);
    if(p.ids.length!==before) changed=true;
  });
  // follows — оставляем, это имена артистов
  if(changed) save();
  return changed;
}
function load(cb){let d=false;const fin=v=>{if(d)return;d=true;if(v){try{S={...S,...JSON.parse(v)}}catch(e){}}migrate();cb()};
 let ls=null;try{ls=localStorage.getItem('s')}catch(e){}
 if(tg?.CloudStorage){try{tg.CloudStorage.getItem('s',(e,v)=>fin(v||ls));setTimeout(()=>fin(ls),1500);return}catch(e){}}
 fin(ls)}

const $=id=>document.getElementById(id);
const I={play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',pause:'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',
 heart:'<svg viewBox="0 0 24 24"><path d="M12 21 10.6 19.7C5.4 15 2 12 2 8.5A5.5 5.5 0 0 1 7.5 3c1.7 0 3.4.8 4.5 2.1A6 6 0 0 1 16.5 3 5.5 5.5 0 0 1 22 8.5c0 3.5-3.4 6.5-8.6 11.2z"/></svg>',
 home:'<svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg>',
 search:'<svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 0 1 6.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1 1 10 2Zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/></svg>',
 lib:'<svg viewBox="0 0 24 24"><path d="M4 4h3v16H4zm5 0h3v16H9zm5.6.6 2.9-.8 4 15.5-2.9.8z"/></svg>',
 me:'<svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4 0-8 2-8 5v3h16v-3c0-3-4-5-8-5z"/></svg>'};
const grad=t=>{if(t.img)return `background-image:url('${t.img}')`;const g=22+(t.t.length*53)%28;return `background:linear-gradient(135deg,hsl(0,0%,${g+14}%),hsl(0,0%,${g-8}%))`;};
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const haptic=()=>tg?.HapticFeedback?.impactOccurred('light');
const toastEl=document.createElement('div');toastEl.id='toast';document.body.appendChild(toastEl);
let tT;function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>toastEl.classList.remove('show'),2800);}
let fxT;function fx(){const v=$('v');v.classList.remove('enter');void v.offsetWidth;v.classList.add('enter');clearTimeout(fxT);fxT=setTimeout(()=>v.classList.remove('enter'),1000);}

let tab='home',cat='Все',seg='likes',cur=null,pop=null,shuffle=false,repeat=false,curCats=[],moodFilter=null,playContext='';
let searchTab='tracks', lastQuery='', searchArtists=[], searchPlaylists=[];
const au=new Audio();
au.preload='auto';
au.crossOrigin='anonymous';
// Keep playing in background when possible
try{
  au.setAttribute('playsinline','');
  au.setAttribute('webkit-playsinline','');
  au.setAttribute('x-webkit-airplay','allow');
}catch(e){}
let wantPlaying=false; // хотим ли продолжать играть (важно в фоне)

// ===== Media Session (шторка / экран блокировки) =====
function updateMediaSession(){
  if(!('mediaSession' in navigator))return;
  const t=reg[cur];
  if(!t){
    try{navigator.mediaSession.metadata=null;}catch(e){}
    return;
  }
  const art=[];
  if(t.img){
    art.push({src:t.img,sizes:'512x512',type:'image/jpeg'});
    art.push({src:t.img,sizes:'256x256',type:'image/jpeg'});
    art.push({src:t.img,sizes:'96x96',type:'image/jpeg'});
  }
  try{
    navigator.mediaSession.metadata=new MediaMetadata({
      title:t.t||'Трек',
      artist:t.a||'CiNV',
      album:'CiNV',
      artwork:art
    });
  }catch(e){}
  try{
    navigator.mediaSession.playbackState=au.paused?'paused':'playing';
  }catch(e){}
  updatePositionState();
}
function updatePositionState(){
  if(!('mediaSession' in navigator)||!au.duration||!isFinite(au.duration))return;
  try{
    navigator.mediaSession.setPositionState({
      duration:au.duration,
      playbackRate:au.playbackRate||1,
      position:Math.min(au.currentTime,au.duration)
    });
  }catch(e){}
}
function setupMediaHandlers(){
  if(!('mediaSession' in navigator))return;
  const h=(action,fn)=>{try{navigator.mediaSession.setActionHandler(action,fn);}catch(e){}};
  h('play',()=>{wantPlaying=true;forcePlay();});
  h('pause',()=>{wantPlaying=false;au.pause();updateMediaSession();});
  h('previoustrack',()=>step(-1,true));
  h('nexttrack',()=>step(1,true));
  h('seekbackward',(d)=>{const off=(d&&d.seekOffset)||10;au.currentTime=Math.max(0,au.currentTime-off);updatePositionState();});
  h('seekforward',(d)=>{const off=(d&&d.seekOffset)||10;au.currentTime=Math.min(au.duration||0,au.currentTime+off);updatePositionState();});
  h('seekto',(d)=>{if(d&&typeof d.seekTime==='number'){au.currentTime=d.seekTime;updatePositionState();}});
  h('stop',()=>{wantPlaying=false;au.pause();au.currentTime=0;updateMediaSession();});
}
setupMediaHandlers();
function forcePlay(){
  wantPlaying=true;
  const p=au.play();
  if(p&&p.then){
    p.then(()=>updateMediaSession()).catch(()=>{
      // повтор в фоне через короткий интервал
      setTimeout(()=>{if(wantPlaying)au.play().catch(()=>{});},250);
      setTimeout(()=>{if(wantPlaying)au.play().catch(()=>{});},800);
    });
  }
  updateMediaSession();
}

// ===== Плеер =====
// Прослушивание считается только если трек доигран до конца (с начала)
let playStartedAt=0;
let countedFor=null;

const preloader=new Audio();preloader.preload='auto';
function preloadNext(fromId){
  try{
    const l=ids();
    const p=l.indexOf(fromId);
    if(p<0)return;
    const n=shuffle?l[Math.floor(Math.random()*l.length)]:l[(p+1)%l.length];
    const t=reg[n];
    if(t&&t.src){preloader.src=t.src;preloader.load();}
  }catch(e){}
}
function resetSeekUI(){
  const seek=$('seek'),c=$('cur'),d=$('dur');
  if(seek){seek.value=0;}
  if(c)c.textContent='0:00';
  if(d)d.textContent='0:00';
}
function play(id,ctx,opts){
  if(!reg[id])return;
  opts=opts||{};
  if(ctx!==undefined) playContext=ctx;
  const changing=id!==cur;
  const bg=opts.bg||document.hidden; // фоновый переход — без анимаций
  wantPlaying=true;
  if(changing){
    const disc=$('disc');
    const mini=$('mini');
    if(!bg){
      disc.classList.add('swap');
      mini?.classList.add('pulse');
    }
    cur=id;
    countedFor=null;
    playStartedAt=0;
    resetSeekUI();
    // Важно: не рвём цепочку play в фоне
    try{au.pause();}catch(e){}
    au.src=reg[id].src;
    try{au.load();}catch(e){}
    touch(id);
    saveLast();
    ui();
    updateMediaSession();
    const start=()=>{
      if(!bg) disc.classList.remove('swap');
      forcePlay();
      ui();
      preloadNext(id);
      if(!bg) setTimeout(()=>mini?.classList.remove('pulse'),400);
    };
    if(au.readyState>=2) start();
    else{
      let done=false;
      const onReady=()=>{
        if(done)return;done=true;
        au.removeEventListener('canplay',onReady);
        au.removeEventListener('loadeddata',onReady);
        start();
      };
      au.addEventListener('canplay',onReady);
      au.addEventListener('loadeddata',onReady);
      setTimeout(()=>{if(!done){done=true;start();}},bg?600:400);
    }
  }else{
    forcePlay();
  }
  if(!bg) haptic();
  if(!changing)ui();
}
function toggle(){
  if(!cur)return play(ids()[0]);
  if(au.paused){wantPlaying=true;forcePlay();}
  else{wantPlaying=false;au.pause();}
  haptic();
  updateMediaSession();
}
function step(d,fromMedia){
  if(!cur)return;
  const l=ids();
  if(!l.length)return;
  const p=l.indexOf(cur);
  const n=shuffle?l[Math.floor(Math.random()*l.length)]:l[(p+d+l.length)%l.length];
  const bg=fromMedia||document.hidden;
  if(bg){
    // мгновенно, без анимации — чтобы в шторке не вставало на паузу
    play(n,playContext,{bg:true});
    return;
  }
  const disc=$('disc');
  disc.style.transition='transform .2s cubic-bezier(.2,.8,.2,1),opacity .18s';
  disc.style.transform=`translateX(${d>0?'-16%':'16%'}) scale(.94)`;
  disc.style.opacity='.45';
  setTimeout(()=>{
    disc.style.transition='';
    disc.style.transform='';
    disc.style.opacity='';
    play(n,playContext,{bg:false});
  },160);
}
function openFull(v){
  if(!cur&&v)return;
  const on=!!v;
  $('full').classList.toggle('open',on);
  document.body.classList.toggle('player-open',on);
}
function like(id){if(!id)return;const k=S.likes.indexOf(id);if(k<0){S.likes.push(id);pop=id;touch(id);}else S.likes.splice(k,1);save();haptic();ui();setTimeout(()=>pop=null,600);}
function follow(n){const a=artists()[n];const k=S.follows.indexOf(a);k<0?S.follows.push(a):S.follows.splice(k,1);save();render();}
function ui(){
  const t=reg[cur];
  if(t){
    $('mT').textContent=$('fT').textContent=t.t;
    const sub=playContext?playContext+' · '+t.a:t.a;
    $('mA').textContent=sub;
    $('fA').textContent=playContext?playContext+' · '+t.a:t.a;
    $('mC').style.cssText=grad(t);$('mC').textContent=t.img?'':(t.t[0]||'♪');
    const disc=$('disc');
    const inner=$('discInner')||disc;
    inner.style.cssText=grad(t)+(t.img?'':';');
    if(!t.img){inner.textContent=t.t[0]||'♪';}else{inner.textContent='';}
    if(t.img) disc.style.boxShadow='0 24px 70px rgba(0,0,0,.45), 0 0 40px rgba(255,255,255,.06)';
    else disc.style.boxShadow='';
    $('like').classList.toggle('on',S.likes.includes(cur));
    const topTitle=document.querySelector('#full .top span');
    if(topTitle) topTitle.textContent=playContext||'Сейчас играет';
  }
  const playing=!au.paused&&!!cur;
  const ic=au.paused?I.play:I.pause;
  $('mP').innerHTML=ic;$('pp').innerHTML=ic;
  $('disc').classList.toggle('go',playing);
  const mini=$('mini');if(mini) mini.classList.toggle('playing',playing);
  document.querySelectorAll('.item').forEach(el=>{
    const on=el.getAttribute('onclick')?.includes(`'${cur}'`);
    el.classList.toggle('cur',!!on);
    const b=el.querySelector('b');
    if(!b)return;
    const hasEq=b.querySelector('.eq');
    if(on&&playing){
      if(!hasEq) b.insertAdjacentHTML('afterbegin','<i class="eq"><b></b><b></b><b></b></i>');
    }else if(hasEq) hasEq.remove();
  });
  document.querySelectorAll('.card').forEach(el=>{
    const on=el.getAttribute('onclick')?.includes(`'${cur}'`);
    el.classList.toggle('playing',!!(on&&playing));
    const cp=el.querySelector('.cp');
    if(cp) cp.innerHTML=(on&&playing)?I.pause:I.play;
  });
  updateMediaSession();
}
function countListenIfNeeded(){
  // Считаем прослушивание, если пройдено больше 50% трека
  if(!cur||countedFor===cur||!au.duration||!isFinite(au.duration))return;
  if(au.currentTime/au.duration>=0.5){
    S.plays[cur]=(S.plays[cur]||0)+1;
    countedFor=cur;
    save();
  }
}
au.addEventListener('play',()=>{
  if(playStartedAt===0||au.currentTime<2) playStartedAt=au.currentTime;

  updateMediaSession();

function validDuration(){

  return d&&isFinite(d)&&d>0&&d<3*3600; // >3ч = стрим/битые метаданные
}

au.addEventListener('timeupdate',()=>{
  // не тянем старые значения, если трек только сменился
  if(!cur)return;
  $('cur').textContent=fmt(au.currentTime);
  if(validDuration()){
    $('seek').value=(au.currentTime/au.duration)*100;
    $('dur').textContent=fmt(au.duration);
    countListenIfNeeded();
  }else{
    $('seek').value=0;
  }
  const now=Date.now();
  if(!au._lastPos||now-au._lastPos>1000){au._lastPos=now;updatePositionState();}
  if(!au._lastSave||now-au._lastSave>8000){au._lastSave=now;saveLast();}
});
au.addEventListener('ended',()=>{
  countListenIfNeeded();

    wantPlaying=true;forcePlay();
  }else{
    // fromMedia=true → без анимации, сразу следующий (важно в шторке)
    step(1,true);
  }
});
document.addEventListener('visibilitychange',()=>{

});

const CAT_TABS=['Все','Хип-хоп','Поп','Рок','Электро','Lo-Fi','Phonk','Радио'];

function mapRuCat(t){
  if(t._radio||t.cat==='Радио')return 'Радио';
  const g=((t.cat||'')+' '+(t.mood||'')+' '+t.t+' '+t.a).toLowerCase();
  if(/phonk|drift/.test(g))return 'Phonk';
  if(/hip|rap|trap|улиц|хип/.test(g))return 'Хип-хоп';
  if(/rock|metal|punk|рок/.test(g))return 'Рок';
  if(/lo-?fi|lofi|chill|ambient|лофи/.test(g))return 'Lo-Fi';
  if(/electro|techno|house|edm|electronic|электрон/.test(g))return 'Электро';
  if(/pop|r&b|soul|поп/.test(g))return 'Поп';
  return t.catRu||'Разное';
}
function mapRuMood(t){
  const g=((t.cat||'')+' '+(t.mood||'')+' '+t.t).toLowerCase();
  const h=(t.t||'').length%2;
  if(/phonk|trap|rap|hip|улиц/.test(g))return 'Улица';
  if(/lo-?fi|chill|ambient|calm|soft|лофи/.test(g))return h?'Вечер':'Работа';
  if(/rock|metal|electronic|house|techno|энерг/.test(g))return h?'В дорогу':'Спорт';
  if(/soul|r&b|ballad|sad|lyric|поп/.test(g))return 'Лирика';
  return t.mood||'Вечер';
}

async function remoteAll(k){
  try{
    const opts={signal:AbortSignal.timeout?.(9000)};
    const [tr,ur,pr,ov,ft]=await Promise.all([
      fetch(`${API}/tracks/search?query=${encodeURIComponent(k)}&limit=25&app_name=CiNV`,opts),
      fetch(`${API}/users/search?query=${encodeURIComponent(k)}&limit=12&app_name=CiNV`,opts),
      fetch(`${API}/playlists/search?query=${encodeURIComponent(k)}&limit=12&app_name=CiNV`,opts),
      fetchOpenverse(k,15),
      fetchFreeToUse(k,15)
    ]);
    const tracksData=((await tr.json()).data||[]).filter(x=>x.is_streamable!==false).map(mapT);
    [...tracksData,...ov,...ft].forEach(t=>{
      t=enrichTrack(t);
      if(!isRussianTrack(t))return;
      if(!reg[t.id]){reg[t.id]=t;extra.push(t);}
    });
    const usersData=((await ur.json()).data||[]).map(u=>({
      id:u.id,name:u.name||u.handle,img:u.profile_picture?.['150x150']||u.profile_picture?.['480x480']||'',
      track_count:u.track_count,follower_count:u.follower_count
    }));
    searchArtists=usersData;
    const plsData=((await pr.json()).data||[]).map(p=>({
      id:p.id,name:p.playlist_name,img:p.artwork?.['150x150']||p.artwork?.['480x480']||'',
      track_count:p.track_count,user:p.user?.name||''
    }));
    searchPlaylists=plsData;
    const q=$('q');
    if(tab==='search'&&q&&q.value.trim().toLowerCase()===k) renderSearchResults(k);
  }catch(e){
    if(tab==='search') $('res').innerHTML='<div class="empty">Не удалось загрузить результаты</div>';
  }
}

async function openRemotePlaylist(plId,name){
  toast('Открываем «'+name+'»…');
  try{
    const r=await fetch(`${API}/playlists/${plId}/tracks?limit=40&app_name=CiNV`,{signal:AbortSignal.timeout?.(9000)});
    const list=((await r.json()).data||[]).filter(x=>x.is_streamable!==false).map(mapT);
    list.forEach(t=>{if(!reg[t.id]){reg[t.id]=t;extra.push(t)}});
    if(list.length){
      // create local playlist from remote
      const exists=S.pls.find(p=>p.n===name);
      if(!exists){S.pls.push({n:name.slice(0,30),ids:list.map(t=>t.id)});save();}
      searchTab='tracks';
      lastQuery=name.toLowerCase();
      const q=$('q');if(q){q.value=name;$('sw').classList.add('has');}
      render();
      setTimeout(()=>renderSearchResults(name.toLowerCase()),50);
      play(list[0].id);
      toast('Плейлист добавлен в медиатеку');
    }else toast('В плейлисте нет доступных треков');
  }catch(e){toast('Не удалось открыть плейлист');}
}

function isRussianTrack(t){
  if(!t)return false;
  if(t._radio){
    const c=(t.a||'')+' '+(t.t||'');
    return /russia|russian|рус|россия|украин|беларус|казах|\bRU\b|\bUA\b|\bBY\b|\bKZ\b/i.test(c)||/[а-яёА-ЯЁ]/.test(t.t||'');
  }
  const s=((t.t||'')+' '+(t.a||'')+' '+(t.cat||'')).toLowerCase();
  if(/[а-яёА-ЯЁ]/.test(s))return true;
  if(/russian|русск|miyagi|эндшпиль|скриптон|macan|instasamka|morgenshtern|оксимирон|\bface\b|лсп|\bmot\b|баста|каста|тимати|корж|jah khalib|xcho|slava marlow|егор крид|t-fest|og buda|kizaru|платина|scally|rakhim|sqwoz|mayot|пошлая|земфира|ддт|\bкино\b|сплин|би-2/i.test(s))return true;
  return false;
}
function enrichTrack(t,forcedMood){
  t.catRu=mapRuCat(t);
  t.moodRu=forcedMood||mapRuMood(t);
  t._ru=isRussianTrack(t)?1:0;
  t._q=(t._ru?50:0)+(t.img?20:0);
  return t;
}
// Только русские / СНГ запросы
const MOOD_QUERIES={
  'В дорогу':['русский phonk','phonk russian','drift phonk','русский электро'],
  'Вечер':['русский lofi','lofi russian','спокойная русская','русский chill'],
  'Работа':['русский ambient','lofi russian','спокойная музыка'],
  'Спорт':['русский рэп','russian trap','энергичный русский'],
  'Улица':['русский рэп','russian rap','русский хип-хоп','russian hip hop','macan','miyagi'],
  'Лирика':['русская лирика','русский поп','грустная русская','russian pop']
};
async function fetchAudius(query,limit=15){
  try{
    const r=await fetch(`${API}/tracks/search?query=${encodeURIComponent(query)}&limit=${limit}&app_name=CiNV`,{signal:AbortSignal.timeout?.(10000)});
    const data=((await r.json()).data||[]).filter(x=>x.is_streamable!==false&&(x.duration||60)>=45);
    return data.map(mapT);
  }catch(e){return[];}
}
// Openverse — CC-музыка (Jamendo и др.), без ключа
async function fetchOpenverse(query,limit=15){
  try{
    const r=await fetch(`https://api.openverse.org/v1/audio/?q=${encodeURIComponent(query)}&page_size=${limit}&category=music`,{signal:AbortSignal.timeout?.(10000)});
    const results=((await r.json()).results)||[];
    return results.filter(x=>x.url&&x.title).map(x=>({
      id:'ov_'+x.id,
      t:String(x.title).slice(0,80),
      a:x.creator||'Openverse',
      cat:(x.genres&&x.genres[0])||'Разное',
      img:x.thumbnail||'',
      src:x.url,
      mood:'Вечер'
    }));
  }catch(e){return[];}
}
// FreeToUse — royalty-free треки, без ключа
async function fetchFreeToUse(query,limit=15){
  try{
    const r=await fetch(`https://api.freetouse.com/v3/music/tracks/search?q=${encodeURIComponent(query)}&limit=${limit}`,{signal:AbortSignal.timeout?.(10000)});
    const data=((await r.json()).data)||[];
    return data.filter(x=>x.files?.mp3&&!x.is_premium).map(x=>{
      const artist=Array.isArray(x.artists)&&x.artists[0]? (x.artists[0][1]?.name||x.artists[0].name||'Artist') : 'FreeToUse';
      return {
        id:'ftu_'+x.id,
        t:String(x.title||'Track').slice(0,80),
        a:artist,
        cat:x.genre||'Разное',
        img:x.thumbnails?.md||x.thumbnails?.sm||'',
        src:x.files.mp3,
        mood:'Вечер'
      };
    });
  }catch(e){return[];}
}
// Internet Archive — CC / public domain
async function fetchArchive(query,limit=6){
  try{
    const q=`(${query}) AND mediatype:audio AND (licenseurl:*creativecommons* OR licenseurl:*publicdomain*)`;
    const url=`https://archive.org/advancedsearch.php?q=${encodeURIComponent(q)}&fl[]=identifier&fl[]=title&fl[]=creator&rows=${limit}&page=1&output=json`;
    const r=await fetch(url,{signal:AbortSignal.timeout?.(10000)});
    const docs=((await r.json()).response?.docs)||[];
    const out=[];
    for(const d of docs){
      if(!d.identifier||!d.title)continue;
      try{
        const meta=await fetch(`https://archive.org/metadata/${d.identifier}`,{signal:AbortSignal.timeout?.(5000)});
        const files=((await meta.json()).files||[]).filter(f=>/\.mp3$/i.test(f.name)&&!/sample|preview/i.test(f.name));
        const f=files.sort((a,b)=>(b.size||0)-(a.size||0))[0];
        if(!f)continue;
        out.push({
          id:'ia_'+d.identifier,
          t:String(d.title).slice(0,80),
          a:(Array.isArray(d.creator)?d.creator[0]:d.creator)||'Archive',
          cat:'Разное',img:'',
          src:`https://archive.org/download/${d.identifier}/${encodeURIComponent(f.name)}`,
          mood:'Вечер'
        });
      }catch(e){}
      if(out.length>=4)break;
    }
    return out;
  }catch(e){return[];}
}
// Radio Browser — открытые радиостанции (как «живые» потоки)
async function fetchRadio(tag,limit=8){
  try{
    const r=await fetch(`https://de1.api.radio-browser.info/json/stations/search?tag=${encodeURIComponent(tag)}&limit=${limit}&hidebroken=true&order=votes&reverse=true`,{
      headers:{'User-Agent':'CiNV/1.0'},
      signal:AbortSignal.timeout?.(10000)
    });
    const list=await r.json();
    return (list||[]).filter(s=>s.url_resolved||s.url).map(s=>({
      id:'rb_'+s.stationuuid,
      t:String(s.name||'Radio').trim().slice(0,80),
      a:(s.country||'Radio')+(s.tags?(' · '+String(s.tags).split(',')[0]):''),
      cat:'Радио',
      img:s.favicon||'',
      src:s.url_resolved||s.url,
      mood:'Вечер',
      _radio:true
    }));
  }catch(e){return[];}
}
async function fetchAllSources(query,limit=12){
  const [a,o,f]=await Promise.all([
    fetchAudius(query,limit),
    fetchOpenverse(query,limit),
    fetchFreeToUse(query,limit)
  ]);
  return [...a,...o,...f];
}
async function loadNet(silent){
 try{
  const all=[];
  // 1) Подборки
  const moodJobs=Object.entries(MOOD_QUERIES).map(async([mood,qs])=>{
    const chunks=await Promise.all(qs.slice(0,2).map(q=>fetchAllSources(q,15)));
    chunks.flat().forEach(t=>all.push(enrichTrack(t,mood)));
  });
  // 2) Только русские запросы
  const extraQs=[
    'русский','russian','русский рэп','russian rap','русский хип-хоп','russian hip hop',
    'miyagi','эндшпиль','macan','instasamka','скриптон','morgenshtern',
    'русский поп','русский рок','русский phonk','phonk russian','лофи русский',
    'русский trap','xcho','jah khalib','slava marlow','og buda','kizaru',
    'платина','scally milano','mayot','rakhim','пошлая молли','t-fest',
    'баста','каста','оксимирон','земля','москва рэп','питер рэп'
  ];
  const extraJobs=extraQs.map(async q=>{
    (await fetchAllSources(q,15)).forEach(t=>all.push(enrichTrack(t)));
  });
  // 3) Русское радио
  const sideJobs=[
    ...['russian','russia','русский','hiphop','rap'].map(tag=>
      fetchRadio(tag,10).then(list=>list.forEach(t=>all.push(enrichTrack(t))))
    )
  ];

  await Promise.allSettled([...moodJobs,...extraJobs,...sideJobs]);

  const seen=new Set();
  let list=all.filter(t=>{
    if(!t||!t.id||!t.src||seen.has(t.id))return false;
    if(!isRussianTrack(t))return false; // только русские
    seen.add(t.id);
    return true;
  });
  list.sort((a,b)=>(b._q-a._q));
  if(list.length>300) list=list.slice(0,300);

  if(list.length){
    list.forEach(t=>reg[t.id]=t);
    const oldIds=new Set(tracks.map(t=>t.id));
    const fresh=list.filter(t=>!oldIds.has(t.id));
    tracks=list;
    extra=extra.filter(t=>isRussianTrack(t));
    cleanForeignFromProfile(); // вычистить иностранные из plays/likes/плейлистов
    if(fresh.length&&silent) toast(`+${fresh.length} русских треков`);
    cat='Все';
  }else if(!silent) toast('Русских треков пока мало — показаны доступные');
 }catch(e){if(!silent) toast('Нет связи с каталогом');}
 loading=false;fx();render();
 if(!cur&&S.last) restoreLast();
}

// Auto-refresh catalog every 4 minutes so new releases appear
