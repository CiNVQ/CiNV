<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Melody</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#120a2e;--bg2:#2a1371;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.14);--acc:#7c3aed;--acc2:#a855f7;--txt:#fff;--mut:#b9a9e6}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:Manrope,system-ui,sans-serif;overflow:hidden}
body{background:radial-gradient(120% 60% at 50% 0,var(--bg2),var(--bg) 70%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.screen{position:absolute;inset:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 170px;overflow-y:auto;transition:transform .35s,opacity .35s}
.hide{opacity:0;pointer-events:none;transform:translateY(24px)}
header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.ava{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--acc2),#2563eb);display:grid;place-items:center;font-weight:800}
header small{color:var(--mut);display:block;font-size:12px}header b{font-size:17px}
header .sp{flex:1}
.ib{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
h2{font-size:17px;font-weight:800;margin:22px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
h2 span{font-size:12px;color:var(--mut);font-weight:600}
.hero{height:150px;border-radius:22px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:10px;background:linear-gradient(120deg,rgba(10,5,40,.85),rgba(124,58,237,.35)),linear-gradient(135deg,#5b21b6,#1d4ed8);border:1px solid var(--line)}
.hero b{font-size:19px;line-height:1.25}
.pill{background:var(--acc);padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600}
.chips{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{padding:9px 20px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc)}
.row{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.tile{flex:0 0 112px;text-align:left}
.cov{aspect-ratio:1;border-radius:18px;border:1px solid var(--line);display:grid;place-items:center;font-size:30px;font-weight:800;margin-bottom:8px}
.tile b,.item b{display:block;font-size:13px}.tile small,.item small{color:var(--mut);font-size:11px}
.item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;width:100%;text-align:left}
.item .cov{width:52px;flex:none;margin:0;font-size:20px;border-radius:14px}
.item .t{flex:1;min-width:0}.item.cur{border-color:var(--acc2);background:rgba(124,58,237,.25)}
.play{width:34px;height:34px;border-radius:50%;background:var(--acc);display:grid;place-items:center}
svg{width:20px;height:20px;fill:currentColor}
/* mini player + nav */
#mini{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:20px;background:rgba(60,30,130,.75);backdrop-filter:blur(14px);border:1px solid var(--line);text-align:left}
#mini .cov{width:42px;margin:0;font-size:16px;border-radius:12px;flex:none}
#mini .t{flex:1;min-width:0}#mini b{font-size:14px;display:block}#mini small{font-size:11px;color:var(--mut)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:6px;padding:6px;border-radius:30px;background:rgba(30,15,80,.8);backdrop-filter:blur(14px);border:1px solid var(--line)}
nav button{width:52px;height:46px;border-radius:24px;display:grid;place-items:center;color:var(--mut)}
nav button.on{background:var(--acc);color:#fff}
/* full player */
#full{display:flex;flex-direction:column;align-items:center;padding-bottom:30px;background:linear-gradient(180deg,#4c1d95,var(--bg) 75%);z-index:5}
#full .top{width:100%;display:flex;justify-content:space-between;align-items:center;font-weight:600}
#disc{width:min(72vw,300px);aspect-ratio:1;border-radius:50%;margin:34px 0 28px;border:10px solid rgba(255,255,255,.16);display:grid;place-items:center;font-size:70px;font-weight:800;box-shadow:0 0 70px rgba(168,85,247,.5);animation:spin 18s linear infinite;animation-play-state:paused}
#disc.go{animation-play-state:running}@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#disc{animation:none}}
.meta{width:100%;display:flex;justify-content:space-between;align-items:center}
.meta b{font-size:22px;display:block}.meta small{color:var(--mut)}
#seek{width:100%;margin:22px 0 6px;accent-color:var(--acc2)}
.times{width:100%;display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.ctl{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:22px}
.ctl .big{width:70px;height:70px;border-radius:50%;background:var(--acc);display:grid;place-items:center;box-shadow:0 0 30px rgba(124,58,237,.7)}
.big svg{width:30px;height:30px}.on-t{color:var(--acc2)}
</style>
</head>
<body>
<div class="screen" id="home">
  <header>
    <div class="ava" id="ava">M</div>
    <div><small>Доброе утро!</small><b id="name">Слушатель</b></div>
    <div class="sp"></div>
    <button class="ib" aria-label="Поиск"><svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 0 1 6.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1 1 10 2Zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/></svg></button>
  </header>
  <h2 style="margin-top:0">Новые подборки</h2>
  <div class="hero"><b>30 дней бесплатно<br>только для вас</b><button class="pill" onclick="play(0)">Слушать</button></div>
  <h2>Категории <span>Все</span></h2>
  <div class="chips" id="chips"></div>
  <h2>Популярное <span>Все</span></h2>
  <div class="row" id="pop"></div>
  <h2>Любимый плейлист <span>Все</span></h2>
  <div id="list"></div>
</div>

<div class="screen hide" id="full">
  <div class="top"><button class="ib" onclick="openFull(false)" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="m15.4 5.4-6.6 6.6 6.6 6.6-1.4 1.4L6 12l8-8z"/></svg></button><span>Сейчас играет</span><span style="width:40px"></span></div>
  <div id="disc"></div>
  <div class="meta"><div><b id="fT"></b><small id="fA"></small></div><button class="ib" id="like" aria-label="В избранное"><svg viewBox="0 0 24 24"><path d="M12 21 10.6 19.7C5.4 15 2 12 2 8.5A5.5 5.5 0 0 1 7.5 3c1.7 0 3.4.8 4.5 2.1A6 6 0 0 1 16.5 3 5.5 5.5 0 0 1 22 8.5c0 3.5-3.4 6.5-8.6 11.2z"/></svg></button></div>
  <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
  <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <div class="ctl">
    <button id="shuf" aria-label="Перемешать"><svg viewBox="0 0 24 24"><path d="M17 3h4v4l-1.5-1.5-4 4-1.4-1.4 4-4zM3 6h4l9 12h3l-1.5-1.5 1.4-1.4L21 17.5V21h-4v-2h-1.5L6 8H3zm0 12h3l2-3 1.3 1.7L7.5 20H3z"/></svg></button>
    <button onclick="step(-1)" aria-label="Предыдущий"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zm3 7 10-7v14z"/></svg></button>
    <button class="big" id="pp" onclick="toggle()" aria-label="Играть/пауза"></button>
    <button onclick="step(1)" aria-label="Следующий"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5l10 7L5 19z"/></svg></button>
    <button id="rep" aria-label="Повтор"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
  </div>
</div>

<button id="mini" onclick="openFull(true)">
  <div class="cov" id="mC"></div>
  <div class="t"><b id="mT">Выберите трек</b><small id="mA">Melody</small></div>
  <span class="play" id="mP" onclick="event.stopPropagation();toggle()"></span>
</button>
<nav>
  <button class="on" aria-label="Главная"><svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg></button>
  <button aria-label="Избранное"><svg viewBox="0 0 24 24"><path d="M12 21 10.6 19.7C5.4 15 2 12 2 8.5A5.5 5.5 0 0 1 7.5 3c1.7 0 3.4.8 4.5 2.1A6 6 0 0 1 16.5 3 5.5 5.5 0 0 1 22 8.5c0 3.5-3.4 6.5-8.6 11.2z"/></svg></button>
  <button aria-label="Профиль"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4 0-8 2-8 5v3h16v-3c0-3-4-5-8-5z"/></svg></button>
</nav>

<script>
const tg = window.Telegram?.WebApp;
if (tg){ tg.ready(); tg.expand(); tg.setHeaderColor?.('#120a2e'); tg.setBackgroundColor?.('#120a2e');
  const u = tg.initDataUnsafe?.user; if(u){ name.textContent=u.first_name; ava.textContent=u.first_name[0]; } }

// ЗАМЕНИТЕ на свои треки (ссылки на mp3 по https)
const U='https://www.soundhelix.com/examples/mp3/SoundHelix-Song-';
const tracks=[
 {t:'Midnight Vibes',a:'The Weekend',c:['#7c3aed','#2563eb'],cat:'Новинки',src:U+'1.mp3'},
 {t:'Ocean Eyes',a:'Soft voice',c:['#0ea5e9','#6d28d9'],cat:'Новинки',src:U+'2.mp3'},
 {t:'Circles Run',a:'Fan fav',c:['#f59e0b','#be123c'],cat:'Вечеринка',src:U+'3.mp3'},
 {t:'Blinding Light',a:'Top hit',c:['#10b981','#4338ca'],cat:'Вечеринка',src:U+'4.mp3'},
 {t:'Rok Anthems',a:'Rock • Classic',c:['#ef4444','#7c3aed'],cat:'Рок',src:U+'5.mp3'},
 {t:'Legends Forever',a:'Rock • Hits',c:['#d946ef','#1e3a8a'],cat:'Рок',src:U+'6.mp3'},
];
const cats=['Все','Вечеринка','Новинки','Рок'];
let cat='Все', idx=-1, order=[], shuffle=false, repeat=false;
const au=new Audio(); au.preload='metadata';
const I={play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',pause:'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>'};
const grad=t=>`background:linear-gradient(135deg,${t.c[0]},${t.c[1]})`;
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const $=id=>document.getElementById(id);

function render(){
  $('chips').innerHTML=cats.map(c=>`<button class="chip ${c==cat?'on':''}" onclick="cat='${c}';render()">${c}</button>`).join('');
  const vis=tracks.map((t,i)=>({t,i})).filter(x=>cat=='Все'||x.t.cat==cat);
  $('pop').innerHTML=vis.map(({t,i})=>`<button class="tile" onclick="play(${i})"><div class="cov" style="${grad(t)}">${t.t[0]}</div><b>${t.t}</b><small>${t.a}</small></button>`).join('');
  $('list').innerHTML=vis.map(({t,i})=>`<button class="item ${i==idx?'cur':''}" onclick="play(${i})"><div class="cov" style="${grad(t)}">${t.t[0]}</div><div class="t"><b>${t.t}</b><small>${t.a}</small></div><span class="play">${i==idx&&!au.paused?I.pause:I.play}</span></button>`).join('');
}
function play(i){
  if(i!==idx){ idx=i; au.src=tracks[i].src; }
  au.play(); haptic(); ui();
}
function toggle(){ if(idx<0) return play(0); au.paused?au.play():au.pause(); haptic(); }
function step(d){
  if(idx<0) return;
  const n=shuffle?Math.floor(Math.random()*tracks.length):(idx+d+tracks.length)%tracks.length;
  idx=-1; play(n);
}
function haptic(){ tg?.HapticFeedback?.impactOccurred('light'); }
function openFull(v){ if(idx<0&&v) return; $('full').classList.toggle('hide',!v); }
function ui(){
  const t=tracks[idx]; if(!t) return;
  $('mT').textContent=$('fT').textContent=t.t; $('mA').textContent=$('fA').textContent=t.a;
  $('mC').style.cssText=grad(t); $('mC').textContent=t.t[0];
  $('disc').style.cssText=grad(t); $('disc').textContent=t.t[0];
  const ic=au.paused?I.play:I.pause; $('mP').innerHTML=ic; $('pp').innerHTML=ic;
  $('disc').classList.toggle('go',!au.paused); render();
}
$('mP').innerHTML=I.play; $('pp').innerHTML=I.play;
au.addEventListener('play',ui); au.addEventListener('pause',ui);
au.addEventListener('loadedmetadata',()=>$('dur').textContent=fmt(au.duration));
au.addEventListener('timeupdate',()=>{ $('cur').textContent=fmt(au.currentTime); if(au.duration) $('seek').value=au.currentTime/au.duration*100; });
au.addEventListener('ended',()=>repeat?(au.currentTime=0,au.play()):step(1));
$('seek').addEventListener('input',e=>{ if(au.duration) au.currentTime=e.target.value/100*au.duration; });
$('shuf').onclick=e=>{shuffle=!shuffle;e.currentTarget.classList.toggle('on-t',shuffle)};
$('rep').onclick=e=>{repeat=!repeat;e.currentTarget.classList.toggle('on-t',repeat)};
$('like').onclick=e=>e.currentTarget.classList.toggle('on-t');
render();
</script>
</body>
</html>
