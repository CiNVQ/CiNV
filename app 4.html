<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CiNV</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#000;--card:#1c1c1e;--line:rgba(255,255,255,.12);--txt:#fff;--mut:#8e8e93;--acc:#fff;--acc2:#fff;--on:#000}
:root[data-theme=light]{--bg:#f2f2f7;--card:#fff;--line:rgba(0,0,0,.1);--txt:#000;--acc:#000;--acc2:#000;--on:#fff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
.screen{position:absolute;inset:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 180px;overflow-y:auto}
.hide{display:none!important}
.ava{width:42px;height:42px;border-radius:50%;background:var(--acc);color:var(--on);display:grid;place-items:center;font-weight:600;flex:none;background-size:cover;background-position:center;overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-bottom:12px}
h2{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:20px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 span{font-size:13px;color:var(--mut);font-weight:400}
.pill{background:var(--acc);color:var(--on);padding:8px 16px;border-radius:999px;font-size:14px;font-weight:600;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:6px}.chips::-webkit-scrollbar{display:none}
.chip{padding:6px 13px;border-radius:999px;background:var(--card);font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--acc);color:var(--on)}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:.5px solid var(--line);cursor:pointer}
.item .cov{width:48px;height:48px;flex:none;margin:0;font-size:18px;border-radius:10px;display:grid;place-items:center;background-size:cover;background-position:center;color:rgba(255,255,255,.85)}
.item .t{flex:1;min-width:0}.item.cur .cov{outline:2px solid var(--acc);outline-offset:2px}
.item b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{color:var(--mut);font-size:12px}
.ib{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib:not(.on) svg{opacity:.35}
.rank{width:26px;text-align:center;font-size:17px;font-weight:300;color:var(--mut)}
svg{width:20px;height:20px;fill:currentColor}
input[type=text]{width:100%;padding:10px 12px;border-radius:12px;background:var(--card);border:0;outline:0;margin-bottom:14px;font-size:15px}
.add{display:flex;gap:10px;margin-bottom:14px;align-items:flex-start}.add input{margin:0}
.empty{color:var(--mut);text-align:center;padding:34px 10px;font-size:15px}
.ah{display:flex;align-items:center;justify-content:space-between;margin:22px 0 6px;font-weight:700;font-size:18px}
#mini{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:420px;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);display:flex;align-items:center;gap:10px;padding:5px 8px 5px 5px;border-radius:999px;background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);text-align:left;box-shadow:0 2px 20px rgba(0,0,0,.25);z-index:18;pointer-events:auto}
#mini .cov{width:34px;height:34px;margin:0;font-size:14px;border-radius:50%;flex:none;display:grid;place-items:center;background-size:cover}
#mini .t{flex:1;min-width:0}#mini b{font-size:14px;font-weight:500;display:block}#mini small{font-size:11px;color:var(--mut)}
.play{width:30px;height:30px;display:grid;place-items:center;flex:none}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;padding:6px;gap:4px;border-radius:999px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:.5px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:20;pointer-events:auto}
nav button{flex:none;width:68px;height:52px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--mut);pointer-events:auto}
nav button svg{width:26px;height:26px}nav button.on{background:var(--txt);color:var(--bg)}
#full{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 26px calc(env(safe-area-inset-bottom,0px) + 30px);background:var(--bg);transform:translateY(100%);visibility:hidden;pointer-events:none;transition:transform .5s cubic-bezier(.2,.8,.2,1),visibility 0s .5s}
#full.open{transform:none;visibility:visible;pointer-events:auto;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#full .top{width:100%;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px}
#disc{width:min(68vw,270px);aspect-ratio:1;border-radius:22px;margin:20px 0;display:grid;place-items:center;font-size:70px;font-weight:600;color:rgba(255,255,255,.85);box-shadow:0 20px 50px rgba(0,0,0,.35);background-size:cover;background-position:center;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .3s}
#disc:not(.go){transform:scale(.88)}
#disc.swap{opacity:0;transform:scale(.8)}
.meta{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px}
.meta b{font-size:22px;font-weight:800;letter-spacing:-.03em;display:block}.meta small{color:var(--mut);font-size:15px}
#seek{width:100%;margin:22px 0 6px;accent-color:var(--acc)}
.times{width:100%;display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.ctl{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:16px}
.ctl .big{width:60px;height:60px;border-radius:50%;background:var(--acc);color:var(--on);display:grid;place-items:center}
.big svg{width:26px;height:26px}.ctl svg{width:22px;height:22px}.on-t{color:var(--acc);opacity:1}#shuf:not(.on-t),#rep:not(.on-t){color:var(--mut)}
#sheet{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
#sheet>div{width:100%;max-height:70%;overflow:auto;background:var(--card);border-radius:14px 14px 0 0;padding:20px 20px 34px}
.hi{color:var(--mut);font-size:13px;display:block}
.xl{font-size:28px;line-height:1.04;font-weight:800;letter-spacing:-.035em;margin:4px 0 14px}
.tabs{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}.tabs::-webkit-scrollbar{display:none}
.tabs button{font-size:15px;font-weight:700;color:var(--mut);padding-bottom:4px;white-space:nowrap;border-bottom:2px solid transparent;letter-spacing:-.01em}
.tabs button.on{color:var(--txt);border-color:var(--txt)}
.deck{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}.deck::-webkit-scrollbar{display:none}
.card{position:relative;flex:0 0 56%;aspect-ratio:4/5;border-radius:20px;scroll-snap-align:start;overflow:hidden;text-align:left;color:#fff;background-size:cover;background-position:center}
.card::before{content:'';position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.65))}
.big-l,.cap,.cp{position:absolute;z-index:1}
.big-l{top:-6px;right:10px;font-size:110px;font-weight:800;line-height:1;color:rgba(255,255,255,.12)}
.cap{left:12px;right:52px;bottom:12px}.cap b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.1}.cap small{opacity:.7;font-size:12px}
.cp{right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
.pf{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.ava.big{width:72px;height:72px;font-size:28px}
.pn b{font-size:22px;font-weight:800;letter-spacing:-.02em;display:block}.pn small{color:var(--mut);font-size:13px}
.lvl{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.lt{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;font-weight:600}.lt span:last-child{color:var(--mut);font-weight:400}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--txt);border-radius:3px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.stat3{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat3 div{background:var(--card);border-radius:14px;padding:10px 4px;text-align:center}
.stat3 b{font-size:20px;font-weight:800;display:block}.stat3 small{color:var(--mut);font-size:10px}
.br{display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:10px}
.br span{width:100px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.br small{color:var(--mut);width:24px;text-align:right}

/* Mood cards */
.moods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.mood{border-radius:18px;padding:16px 14px;min-height:78px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;text-align:left;color:#fff;font-weight:700;font-size:16px;letter-spacing:-.02em}
.mood small{font-size:12px;font-weight:500;opacity:.75;margin-top:2px}
.mood::after{content:'';position:absolute;inset:0;background:linear-gradient(160deg,transparent 30%,rgba(0,0,0,.35))}

/* Wave / flow card */
.wave{border-radius:22px;padding:20px;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 40%,#0f3460 100%);color:#fff;margin-bottom:6px;position:relative;overflow:hidden}
.wave b{font-size:20px;font-weight:800;display:block;letter-spacing:-.02em}
.wave small{opacity:.7;font-size:13px}
.wave .pill{position:absolute;right:16px;top:50%;transform:translateY(-50%);background:#fff;color:#000}

/* Welcome */
#welcome{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .7s cubic-bezier(.2,.8,.2,1),visibility .7s}
#welcome.hide{opacity:0;visibility:hidden;pointer-events:none}
#welcome .logo{font-size:42px;font-weight:900;letter-spacing:-.04em;opacity:0;transform:translateY(18px);animation:welIn .8s .15s cubic-bezier(.2,.8,.2,1) forwards}
#welcome .sub{font-size:17px;color:var(--mut);opacity:0;transform:translateY(12px);animation:welIn .7s .45s cubic-bezier(.2,.8,.2,1) forwards}
#welcome .name{font-size:22px;font-weight:700;opacity:0;transform:translateY(10px);animation:welIn .7s .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes welIn{to{opacity:1;transform:none}}

/* Animations — richer, Spotify/Yandex-like */
.cov,.card,#disc{background-position:center}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes riseSoft{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.enter>*{animation:rise .48s cubic-bezier(.2,.8,.2,1) both}
.enter>:nth-child(2){animation-delay:.04s}.enter>:nth-child(3){animation-delay:.08s}.enter>:nth-child(4){animation-delay:.12s}.enter>:nth-child(5){animation-delay:.16s}.enter>:nth-child(6){animation-delay:.2s}.enter>:nth-child(7){animation-delay:.24s}.enter>:nth-child(8){animation-delay:.28s}.enter>:nth-child(n+9){animation-delay:.32s}
.item{animation:riseSoft .4s cubic-bezier(.2,.8,.2,1) both}
.item:nth-child(1){animation-delay:.02s}.item:nth-child(2){animation-delay:.05s}.item:nth-child(3){animation-delay:.08s}.item:nth-child(4){animation-delay:.11s}.item:nth-child(5){animation-delay:.14s}.item:nth-child(6){animation-delay:.17s}.item:nth-child(7){animation-delay:.2s}.item:nth-child(8){animation-delay:.23s}.item:nth-child(n+9){animation-delay:.26s}
.card,.item,.chip,.pill,.ib,nav button,.big,.tabs button,.mood,.wave{transition:transform .2s cubic-bezier(.2,.8,.2,1),background .25s,color .25s,box-shadow .25s,opacity .25s}
.card:active,.mood:active,.wave:active{transform:scale(.96)}.item:active{transform:scale(.98)}.chip:active,.pill:active,.ib:active,nav button:active,.tabs button:active{transform:scale(.9)}.big:active{transform:scale(.92)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.45)}100%{transform:scale(1)}}
.ib.pop svg{animation:pop .42s cubic-bezier(.3,1.6,.5,1)}
.item .eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-right:8px;vertical-align:middle}
.item .eq b{display:block;width:3px;height:3px;font-size:0;background:var(--txt);border-radius:2px;animation:eq .85s ease-in-out infinite}
.item .eq b:nth-child(2){animation-delay:.15s}.item .eq b:nth-child(3){animation-delay:.3s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.item b:has(.eq)::before{display:none}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,255,255,.5)}100%{box-shadow:0 0 0 16px rgba(255,255,255,0)}}
.card.playing .cp{animation:ring 1.5s ease-out infinite}
.card.sk{background:linear-gradient(100deg,var(--card) 30%,var(--line) 50%,var(--card) 70%);background-size:200% 100%;animation:sh 1.2s linear infinite}
.card.sk::before{display:none}@keyframes sh{to{background-position:-200% 0}}
#full.open>:not(#disc){animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
#full.open>:nth-child(3){animation-delay:.06s}#full.open>:nth-child(4){animation-delay:.1s}#full.open>:nth-child(5){animation-delay:.14s}#full.open>:nth-child(6){animation-delay:.18s}
#disc{transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .28s,box-shadow .3s}
#disc.swap{opacity:0;transform:scale(.82) translateY(8px)}
#disc.go{box-shadow:0 24px 60px rgba(0,0,0,.4)}
#mini{transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .25s}
#mini.pulse{animation:miniPulse .5s cubic-bezier(.2,.8,.2,1)}
@keyframes miniPulse{0%{transform:translateX(-50%) scale(1)}40%{transform:translateX(-50%) scale(1.03)}100%{transform:translateX(-50%) scale(1)}}
@keyframes up{from{transform:translateY(100%)}}@keyframes fade{from{opacity:0}}
#sheet:not(.hide){animation:fade .22s both}#sheet:not(.hide)>div{animation:up .38s cubic-bezier(.2,.8,.2,1) both}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%) translateY(-30px);opacity:0;background:var(--txt);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;z-index:20;transition:.35s cubic-bezier(.2,.8,.2,1);pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.search-wrap{position:relative;margin-bottom:12px}
.search-wrap input{margin:0;padding-right:40px}
.search-wrap .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--mut);opacity:0;pointer-events:none;transition:.2s}
.search-wrap.has .clear{opacity:1;pointer-events:auto}
.nick-row{display:flex;gap:10px;align-items:center}
.nick-row .pill{opacity:0;pointer-events:none;transform:scale(.9);transition:.25s cubic-bezier(.2,.8,.2,1)}
.nick-row.dirty .pill{opacity:1;pointer-events:auto;transform:none}
.s-tabs{display:flex;gap:8px;margin-bottom:14px}
.s-tabs button{flex:1;padding:8px 0;border-radius:12px;background:var(--card);font-size:13px;font-weight:600;color:var(--mut);transition:.2s}
.s-tabs button.on{background:var(--txt);color:var(--bg)}
.art-card{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:.5px solid var(--line);cursor:pointer;animation:riseSoft .4s both}
.art-card .av{width:48px;height:48px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:700;font-size:18px;background-size:cover;flex:none}
.art-card b{display:block;font-size:16px}.art-card small{color:var(--mut);font-size:12px}
.pl-card{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:.5px solid var(--line);cursor:pointer;animation:riseSoft .4s both}
.pl-card .cov{width:52px;height:52px;border-radius:10px;background:var(--card);display:grid;place-items:center;font-size:20px;background-size:cover;flex:none}
.pl-card b{display:block;font-size:15px}.pl-card small{color:var(--mut);font-size:12px}
.loading-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mut);margin:0 2px;animation:dot 1s ease-in-out infinite}
.loading-dot:nth-child(2){animation-delay:.15s}.loading-dot:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.refresh-hint{text-align:center;font-size:12px;color:var(--mut);padding:8px 0 4px;opacity:.7}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="welcome">
  <div class="logo">CiNV</div>
  <div class="sub">Добро пожаловать</div>
  <div class="name" id="welName"></div>
</div>

<main class="screen" id="v"></main>

<div id="full">
  <div class="top"><button class="ib" onclick="openFull(false)" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="m15.4 5.4-6.6 6.6 6.6 6.6-1.4 1.4L6 12l8-8z"/></svg></button><span>Сейчас играет</span><button class="ib" onclick="sheet()" aria-label="В плейлист"><svg viewBox="0 0 24 24"><path d="M3 6h12v2H3zm0 4h12v2H3zm0 4h8v2H3zm14-4h2v4h4v2h-4v4h-2v-4h-4v-2h4z"/></svg></button></div>
  <div id="disc"></div>
  <div class="meta"><div><b id="fT"></b><small id="fA"></small></div><button class="ib" id="like" onclick="like(cur)" aria-label="Лайк"><svg viewBox="0 0 24 24"><path d="M12 21 10.6 19.7C5.4 15 2 12 2 8.5A5.5 5.5 0 0 1 7.5 3c1.7 0 3.4.8 4.5 2.1A6 6 0 0 1 16.5 3 5.5 5.5 0 0 1 22 8.5c0 3.5-3.4 6.5-8.6 11.2z"/></svg></button></div>
  <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
  <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <div class="ctl">
    <button id="shuf" aria-label="Перемешать"><svg viewBox="0 0 24 24"><path d="M17 3h4v4l-1.5-1.5-4 4-1.4-1.4 4-4zM3 6h4l9 12h3l-1.5-1.5 1.4-1.4L21 17.5V21h-4v-2h-1.5L6 8H3zm0 12h3l2-3 1.3 1.7L7.5 20H3z"/></svg></button>
    <button onclick="step(-1)" aria-label="Предыдущий"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zm3 7 10-7v14z"/></svg></button>
    <button class="big" id="pp" onclick="toggle()" aria-label="Играть/пауза"></button>
    <button onclick="step(1)" aria-label="Следующий"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5l10 7L5 19z"/></svg></button>
    <button id="rep" aria-label="Повтор"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
  </div>
</div>
<div id="sheet" class="hide" onclick="this.classList.add('hide')"><div onclick="event.stopPropagation()" id="sheetIn"></div></div>

<button id="mini" onclick="openFull(true)">
  <div class="cov" id="mC"></div>
  <div class="t"><b id="mT">Выберите трек</b><small id="mA">CiNV</small></div>
  <span class="play" id="mP" onclick="event.stopPropagation();toggle()"></span>
</button>
<nav id="nav"></nav>

<script>
const tg=window.Telegram?.WebApp;
let tgName='Слушатель', tgPhoto='';
const light=tg?tg.colorScheme==='light':matchMedia('(prefers-color-scheme:light)').matches;
document.documentElement.dataset.theme=light?'light':'dark';
if(tg){
  tg.ready();tg.expand();
  const bg=light?'#f2f2f7':'#000000';
  tg.setHeaderColor?.(bg);tg.setBackgroundColor?.(bg);
  const u=tg.initDataUnsafe?.user;
  if(u){tgName=u.first_name||tgName;tgPhoto=u.photo_url||'';}
}

// ===== Каталог: Audius (легальная музыка независимых артистов) =====
const API='https://api.audius.co/v1';
const GN={'Electronic':'Электроника','Hip-Hop/Rap':'Хип-хоп','Pop':'Поп','Rock':'Рок','Ambient':'Эмбиент','Alternative':'Альтернатива','R&B/Soul':'R&B','Lo-Fi':'Lo-Fi','Jazz':'Джаз','Metal':'Метал','Techno':'Техно','House':'Хаус','Indie':'Инди','Folk':'Фолк','Classical':'Классика'};

function guessMood(genre,mood){
  const g=(genre||'').toLowerCase(),m=(mood||'').toLowerCase();
  if(m.includes('chill')||m.includes('relax')||g.includes('ambient')||g.includes('lo-fi')||g.includes('lofi'))return 'Спокойствие';
  if(m.includes('energetic')||m.includes('upbeat')||g.includes('techno')||g.includes('house')||g.includes('electronic'))return 'Энергия';
  if(g.includes('hip-hop')||g.includes('rap')||g.includes('trap'))return 'Улица';
  if(g.includes('jazz')||g.includes('soul')||g.includes('r&b'))return 'Вайб';
  if(g.includes('rock')||g.includes('metal')||g.includes('punk'))return 'Драйв';
  if(g.includes('classical')||g.includes('piano')||g.includes('folk'))return 'Фокус';
  return 'Разное';
}

// ===== Media Session (шторка / экран блокировки) =====
function updateMediaSession(){
  if(!('mediaSession' in navigator))return;
  const t=reg[cur];
  if(!t){
    try{navigator.mediaSession.metadata=null;}catch(e){}
    return;
  }
  const art=[];
  if(t.img){
    art.push({src:t.img,sizes:'512x512',type:'image/jpeg'});
    art.push({src:t.img,sizes:'256x256',type:'image/jpeg'});
    art.push({src:t.img,sizes:'96x96',type:'image/jpeg'});
  }
  try{
    navigator.mediaSession.metadata=new MediaMetadata({
      title:t.t||'Трек',
      artist:t.a||'CiNV',
      album:'CiNV',
      artwork:art
    });
  }catch(e){}
  try{
    navigator.mediaSession.playbackState=au.paused?'paused':'playing';
  }catch(e){}
  updatePositionState();
}
function updatePositionState(){
  if(!('mediaSession' in navigator)||!au.duration||!isFinite(au.duration))return;
  try{
    navigator.mediaSession.setPositionState({
      duration:au.duration,
      playbackRate:au.playbackRate||1,
      position:Math.min(au.currentTime,au.duration)
    });
  }catch(e){}
}
function setupMediaHandlers(){
  if(!('mediaSession' in navigator))return;
  const h=(action,fn)=>{try{navigator.mediaSession.setActionHandler(action,fn);}catch(e){}};
  h('play',()=>{au.play().catch(()=>{});updateMediaSession();});
  h('pause',()=>{au.pause();updateMediaSession();});
  h('previoustrack',()=>step(-1));
  h('nexttrack',()=>step(1));
  h('seekbackward',(d)=>{const off=(d&&d.seekOffset)||10;au.currentTime=Math.max(0,au.currentTime-off);updatePositionState();});
  h('seekforward',(d)=>{const off=(d&&d.seekOffset)||10;au.currentTime=Math.min(au.duration||0,au.currentTime+off);updatePositionState();});
  h('seekto',(d)=>{if(d&&typeof d.seekTime==='number'){au.currentTime=d.seekTime;updatePositionState();}});
  h('stop',()=>{au.pause();au.currentTime=0;updateMediaSession();});
}
setupMediaHandlers();

// ===== Плеер =====
// Прослушивание считается только если трек доигран до конца (с начала)
let playStartedAt=0;
let countedFor=null;

function play(id){
  if(!reg[id])return;
  const changing=id!==cur;
  if(changing){
    const disc=$('disc');
    const mini=$('mini');
    disc.classList.add('swap');
    mini?.classList.add('pulse');
    setTimeout(()=>{
      cur=id;
      countedFor=null;
      playStartedAt=0;
      au.src=reg[id].src;
      touch(id);
      disc.classList.remove('swap');
      au.play().catch(()=>{});
      ui();
      updateMediaSession();
      setTimeout(()=>mini?.classList.remove('pulse'),500);
    },200);
  }else{
    au.play().catch(()=>{});
    updateMediaSession();
  }
  haptic();
  if(!changing)ui();
}
function toggle(){if(!cur)return play(ids()[0]);au.paused?au.play().catch(()=>{}):au.pause();haptic();updateMediaSession();}
function step(d){
  if(!cur)return;
  const l=ids();
  const p=l.indexOf(cur);
  const n=shuffle?l[Math.floor(Math.random()*l.length)]:l[(p+d+l.length)%l.length];
  const disc=$('disc');
  disc.style.transition='transform .28s cubic-bezier(.2,.8,.2,1),opacity .22s';
  disc.style.transform=`translateX(${d>0?'-22%':'22%'}) scale(.9)`;
  disc.style.opacity='.35';
  setTimeout(()=>{
    disc.style.transition='';
    disc.style.transform='';
    disc.style.opacity='';
    cur=null;
    play(n);
  },220);
}
function openFull(v){if(!cur&&v)return;$('full').classList.toggle('open',!!v);}
function like(id){if(!id)return;const k=S.likes.indexOf(id);if(k<0){S.likes.push(id);pop=id;touch(id);}else S.likes.splice(k,1);save();haptic();ui();setTimeout(()=>pop=null,600);}
function follow(n){const a=artists()[n];const k=S.follows.indexOf(a);k<0?S.follows.push(a):S.follows.splice(k,1);save();render();}
function ui(){

  if(t){$('mT').textContent=$('fT').textContent=t.t;$('mA').textContent=$('fA').textContent=t.a;
    $('mC').style.cssText=grad(t);$('mC').textContent=t.img?'':t.t[0];$('disc').style.cssText=grad(t);$('disc').textContent=t.img?'':t.t[0];

    el.classList.toggle('cur',!!on);
    const b=el.querySelector('b');
    if(!b)return;
    const hasEq=b.querySelector('.eq');
    if(on&&!au.paused){
      if(!hasEq) b.insertAdjacentHTML('afterbegin','<i class="eq"><b></b><b></b><b></b></i>');
    }else if(hasEq) hasEq.remove();
  });
  document.querySelectorAll('.card').forEach(el=>{
    const on=el.getAttribute('onclick')?.includes(`'${cur}'`);
    el.classList.toggle('playing',!!(on&&!au.paused));
    const cp=el.querySelector('.cp');
    if(cp) cp.innerHTML=(on&&!au.paused)?I.pause:I.play;
  });
  updateMediaSession();
}
function countFullListen(){
  if(!cur||countedFor===cur)return;
  if(playStartedAt>8)return;
  S.plays[cur]=(S.plays[cur]||0)+1;
  countedFor=cur;
  save();
}
au.addEventListener('play',()=>{
  if(playStartedAt===0||au.currentTime<2) playStartedAt=au.currentTime;
  ui();
  updateMediaSession();
});
au.addEventListener('pause',()=>{ui();updateMediaSession();});
au.addEventListener('error',()=>{if(cur)toast('Не удалось загрузить трек');});
au.addEventListener('loadedmetadata',()=>{$('dur').textContent=fmt(au.duration);updatePositionState();});
au.addEventListener('timeupdate',()=>{
  $('cur').textContent=fmt(au.currentTime);
  if(au.duration)$('seek').value=au.currentTime/au.duration*100;
  // throttle position updates for media session
  if(!au._lastPos||Date.now()-au._lastPos>1000){au._lastPos=Date.now();updatePositionState();}
});
au.addEventListener('ended',()=>{
  countFullListen();
  if(repeat){au.currentTime=0;countedFor=null;playStartedAt=0;au.play().catch(()=>{});}
  else step(1);
});
$('seek').addEventListener('input',e=>{
  if(au.duration){
    const t=e.target.value/100*au.duration;
    if(Math.abs(t-au.currentTime)>3) playStartedAt=Math.max(playStartedAt,t);
    au.currentTime=t;
    updatePositionState();
  }
});

 </div>
 ${ta.length?`<h2>Любимые исполнители</h2>${ta.map(([n,c])=>`<div class="br"><span>${esc(n)}</span><div class="bar"><i style="width:${c/ta[0][1]*100}%"></i></div><small>${c}</small></div>`).join('')}`:''}
 ${gc?`<h2>Любимый жанр</h2><div class="chips"><span class="chip on">${esc(gc[0])}</span></div>`:''}
 <h2>Мой рейтинг прослушиваний</h2>${top.length?top.map((id,n)=>row(id,`<span class="rank">${n+1}</span>`)).join(''):'<div class="empty">Включите трек, и здесь появится рейтинг</div>'}`}
};
function render(){
 const y=$('v').scrollTop;$('v').innerHTML=V[tab]();$('v').scrollTop=y;
 $('nav').innerHTML=[['home',I.home,'Главная'],['search',I.search,'Поиск'],['lib',I.lib,'Медиатека'],['me',I.me,'Профиль']].map(([k,s,n])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')">${s}</button>`).join('');
 if(tab==='me')checkNick();
}
function go(k){tab=k;moodFilter=null;$('v').scrollTop=0;fx();render();}
function setCat(n){cat=curCats[n]||'Все';moodFilter=null;fx();render();}
function setSeg(k){seg=k;fx();render();}
function setMood(m){moodFilter=m;cat='Все';fx();render();}
function playFlow(){
  const liked=S.likes.filter(id=>reg[id]);
  const played=Object.entries(S.plays).sort((a,b)=>b[1]-a[1]).map(e=>e[0]).filter(id=>reg[id]);
  const pool=[...new Set([...liked,...played,...ids()])];
  if(pool.length)play(pool[Math.floor(Math.random()*Math.min(pool.length,15))]);
}

// ===== Поиск: треки / артисты / плейлисты =====
const match=(id,k)=>{
  const t=reg[id];
  if(!t)return false;
  return (t.t+' '+t.a).toLowerCase().includes(k);
};
function searchEmpty(){
  if(!lastQuery)return `<div class="empty">Начни вводить название трека, артиста или плейлиста</div>`;
  return `<div class="empty">Ищем <span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div>`;
}
function setSearchTab(t){
  searchTab=t;
  const q=$('q');
  if(q) renderSearchResults(q.value.trim().toLowerCase());
  // re-render tabs state
  document.querySelectorAll('.s-tabs button').forEach((b,i)=>{
    const keys=['tracks','artists','playlists'];
    b.classList.toggle('on',keys[i]===t);
  });
}
let st;
function onSearchInput(el){
  const wrap=$('sw');
  if(el.value.trim())wrap.classList.add('has');else wrap.classList.remove('has');
  doSearch(el.value);
}
function clearSearch(){
  const q=$('q');
  if(q){q.value='';$('sw').classList.remove('has');lastQuery='';doSearch('');q.focus();}
}
function doSearch(s,local){
  const k=s.trim().toLowerCase();
  lastQuery=k;
  if(!k){
    $('res').innerHTML=searchEmpty();
    return;
  }
  // local first
  renderSearchResults(k);
  if(local||k.length<2)return;
  clearTimeout(st);
  st=setTimeout(()=>remoteAll(k),380);
}
function renderSearchResults(k){
  const res=$('res');
  if(!res)return;
  if(searchTab==='tracks'){
    const local=ids().filter(id=>match(id,k));
    res.innerHTML=local.length?rows(local):searchEmpty();
  }else if(searchTab==='artists'){
    if(!searchArtists.length){res.innerHTML=searchEmpty();return;}
    res.innerHTML=searchArtists.map(a=>{
      const img=a.img?`background-image:url('${esc(a.img)}')`:'';
      return `<div class="art-card" onclick="searchArtistTracks('${esc(a.id)}','${esc(a.name)}')">
        <div class="av" style="${img}">${a.img?'':esc((a.name||'?')[0])}</div>
        <div><b>${esc(a.name)}</b><small>${a.track_count||0} треков · ${a.follower_count?Math.round(a.follower_count/1000)+'k подписчиков':''}</small></div>
      </div>`;
    }).join('')||'<div class="empty">Артисты не найдены</div>';
  }else{
    if(!searchPlaylists.length){res.innerHTML=searchEmpty();return;}
    res.innerHTML=searchPlaylists.map(p=>{
      const img=p.img?`background-image:url('${esc(p.img)}')`:'';
      return `<div class="pl-card" onclick="openRemotePlaylist('${esc(p.id)}','${esc(p.name)}')">
        <div class="cov" style="${img}">${p.img?'':'♫'}</div>
        <div><b>${esc(p.name)}</b><small>${p.track_count||0} треков · ${esc(p.user||'')}</small></div>
      </div>`;
    }).join('')||'<div class="empty">Плейлисты не найдены</div>';
  }
}
async function remoteAll(k){
  try{
    const opts={signal:AbortSignal.timeout?.(9000)};
    const [tr,ur,pr]=await Promise.all([
      fetch(`${API}/tracks/search?query=${encodeURIComponent(k)}&limit=30&app_name=CiNV`,opts),
      fetch(`${API}/users/search?query=${encodeURIComponent(k)}&limit=15&app_name=CiNV`,opts),
      fetch(`${API}/playlists/search?query=${encodeURIComponent(k)}&limit=15&app_name=CiNV`,opts)
    ]);
    const tracksData=((await tr.json()).data||[]).filter(x=>x.is_streamable!==false).map(mapT);
    tracksData.forEach(t=>{if(!reg[t.id]){reg[t.id]=t;extra.push(t)}});
    const usersData=((await ur.json()).data||[]).map(u=>({
      id:u.id,name:u.name||u.handle,img:u.profile_picture?.['150x150']||u.profile_picture?.['480x480']||'',
      track_count:u.track_count,follower_count:u.follower_count
    }));
    searchArtists=usersData;
    const plsData=((await pr.json()).data||[]).map(p=>({
      id:p.id,name:p.playlist_name,img:p.artwork?.['150x150']||p.artwork?.['480x480']||'',
      track_count:p.track_count,user:p.user?.name||''
    }));
    searchPlaylists=plsData;
    const q=$('q');
    if(tab==='search'&&q&&q.value.trim().toLowerCase()===k) renderSearchResults(k);
  }catch(e){
    if(tab==='search') $('res').innerHTML='<div class="empty">Не удалось загрузить результаты</div>';
  }
}
async function searchArtistTracks(userId,name){
  toast('Загружаем треки '+name+'…');
  try{
    const r=await fetch(`${API}/users/${userId}/tracks?limit=30&app_name=CiNV`,{signal:AbortSignal.timeout?.(9000)});
    const list=((await r.json()).data||[]).filter(x=>x.is_streamable!==false).map(mapT);
    list.forEach(t=>{if(!reg[t.id]){reg[t.id]=t;extra.push(t)}});
    searchTab='tracks';
    lastQuery=name.toLowerCase();
    const q=$('q');if(q){q.value=name;$('sw').classList.add('has');}
    render();
    setTimeout(()=>renderSearchResults(name.toLowerCase()),50);
    if(list[0]) play(list[0].id);
  }catch(e){toast('Не удалось загрузить треки артиста');}
}
async function openRemotePlaylist(plId,name){
  toast('Открываем «'+name+'»…');
  try{
    const r=await fetch(`${API}/playlists/${plId}/tracks?limit=40&app_name=CiNV`,{signal:AbortSignal.timeout?.(9000)});
    const list=((await r.json()).data||[]).filter(x=>x.is_streamable!==false).map(mapT);
    list.forEach(t=>{if(!reg[t.id]){reg[t.id]=t;extra.push(t)}});
    if(list.length){
      // create local playlist from remote
      const exists=S.pls.find(p=>p.n===name);
      if(!exists){S.pls.push({n:name.slice(0,30),ids:list.map(t=>t.id)});save();}
      searchTab='tracks';
      lastQuery=name.toLowerCase();
      const q=$('q');if(q){q.value=name;$('sw').classList.add('has');}
      render();
      setTimeout(()=>renderSearchResults(name.toLowerCase()),50);
      play(list[0].id);
      toast('Плейлист добавлен в медиатеку');
    }else toast('В плейлисте нет доступных треков');
  }catch(e){toast('Не удалось открыть плейлист');}
}

// ===== Плейлисты, профиль =====
function newPl(){const n=$('np').value.trim();if(!n)return;S.pls.push({n:n.slice(0,30),ids:[]});save();render();}
function delPl(k){S.pls.splice(k,1);save();render();}
function checkNick(){
  const row=$('nickRow'),inp=$('nick');
  if(!row||!inp)return;
  const dirty=inp.value.trim()!==(S.nick||'');
  row.classList.toggle('dirty',dirty);
}
function saveNick(){
  const inp=$('nick');
  if(!inp)return;
  S.nick=inp.value.trim().replace(/[<>]/g,'');
  save();haptic();
  checkNick();
  render();
  toast('Никнейм сохранён');
}
function sheet(){if(!cur)return;
 $('sheetIn').innerHTML=`<h2 style="margin-top:0">Добавить в плейлист</h2>`+(S.pls.length?S.pls.map((p,k)=>`<div class="item" onclick="addTo(${k})"><div class="t"><b>${esc(p.n)}</b><small>${p.ids.length} треков</small></div></div>`).join(''):'<div class="empty">Сначала создайте плейлист: Моя музыка → Плейлисты</div>');
 $('sheet').classList.remove('hide');}
function addTo(k){const p=S.pls[k];if(!p.ids.includes(cur)){p.ids.push(cur);touch(cur);}save();$('sheet').classList.add('hide');haptic();toast('Добавлено в «'+p.n+'»');render();}

async function loadNet(silent){
 try{
  const opts={signal:AbortSignal.timeout?.(12000)};
  // English genres + Russian / CIS oriented queries (Audius independent artists)
  const queries=[
    'lofi','chill','electronic','hip hop','indie','ambient','house','jazz',
    'russian','русский','hip-hop','rap','поп','рок','phonk','drift phonk',
    'Miyagi','Скриптонит','лофи','электронная','indie rock'
  ];
  const fetches=[
    fetch(`${API}/tracks/trending?limit=40&app_name=CiNV`,opts),
    fetch(`${API}/tracks/trending?limit=25&time=week&app_name=CiNV`,opts),
    fetch(`${API}/tracks/trending?limit=20&time=month&app_name=CiNV`,opts),
    ...queries.map(q=>fetch(`${API}/tracks/search?query=${encodeURIComponent(q)}&limit=15&app_name=CiNV`,opts))
  ];
  const results=await Promise.allSettled(fetches);
  const all=[];
  for(const r of results){
    if(r.status!=='fulfilled')continue;
    try{
      const data=((await r.value.json()).data||[]).filter(x=>x.is_streamable!==false).map(mapT);
      all.push(...data);
    }catch(e){}
  }
  const seen=new Set();
  const list=all.filter(t=>{if(seen.has(t.id))return false;seen.add(t.id);return true;});
  if(list.length){
    list.forEach(t=>reg[t.id]=t);
    const oldIds=new Set(tracks.map(t=>t.id));
    const fresh=list.filter(t=>!oldIds.has(t.id));
    tracks=list;
    if(fresh.length&&silent) toast(`+${fresh.length} новых треков`);
    cat='Все';
  }else if(!silent) toast('Каталог пуст, показаны тестовые треки');
 }catch(e){if(!silent) toast('Нет связи с каталогом, показаны тестовые треки');}
 loading=false;fx();render();
}

// Auto-refresh catalog every 4 minutes so new releases appear
setInterval(()=>loadNet(true),4*60*1000);

// Welcome sequence
function startWelcome(){
  const name=S.nick||tgName;
  $('welName').textContent=name;
  setTimeout(()=>{
    $('welcome').classList.add('hide');
    setTimeout(()=>$('welcome').remove(),800);
  },2200);
}

$('mP').innerHTML=I.play;$('pp').innerHTML=I.play;
render();fx();
load(()=>{render();ui();startWelcome();});
loadNet();
</script>
